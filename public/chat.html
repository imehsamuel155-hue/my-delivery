<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Chat</title>
  <style>
    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      height: 100%;
      font-family: system-ui, sans-serif;
      background: #0b141a;
      color: #e9edef
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #0b141a
    }

    .head {
      background: #1f2c34;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-shrink: 0
    }

    .head strong {
      color: #00a884;
      font-size: 15px
    }

    .head a {
      color: #8696a0;
      font-size: 13px;
      text-decoration: none
    }

    #pinGate {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px
    }

    .card {
      background: #1f2c34;
      padding: 24px 18px;
      border-radius: 12px;
      width: 100%;
      max-width: 360px;
      text-align: center
    }

    .card h1 {
      color: #e9edef;
      font-size: 20px;
      margin: 0 0 8px
    }

    .card p {
      color: #8696a0;
      font-size: 13px
    }

    input,
    button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 0;
      font-size: 16px
    }

    input {
      background: #2a3942;
      color: #e9edef
    }

    button {
      background: #00a884;
      color: #111;
      font-weight: 700;
      cursor: pointer
    }

    button.danger {
      background: #ea4335;
      color: #fff
    }

    .err {
      color: #f87171;
      font-size: 13px;
      min-height: 18px
    }

    #app {
      display: none;
      flex: 1;
      flex-direction: column;
      min-height: 0
    }

    #app.on {
      display: flex
    }

    #listView {
      flex: 1;
      overflow: auto
    }

    .thread {
      display: block;
      width: 100%;
      text-align: left;
      padding: 14px 16px;
      background: #111b21;
      border: 0;
      border-bottom: 1px solid #222d34;
      color: #e9edef;
      cursor: pointer;
      border-radius: 0;
      margin: 0
    }

    .thread strong {
      display: block;
      font-size: 15px
    }

    .thread small {
      color: #8696a0;
      font-size: 13px
    }

    #chatView {
      display: none;
      flex: 1;
      flex-direction: column;
      min-height: 0
    }

    #chatView.on {
      display: flex
    }

    .chatHead {
      background: #1f2c34;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0
    }

    .chatHead button {
      width: auto;
      padding: 8px 12px;
      margin: 0;
      background: #2a3942;
      color: #e9edef
    }

    .chatHead .title {
      flex: 1;
      font-weight: 600;
      font-size: 15px
    }

    .msgs {
      flex: 1;
      overflow: auto;
      padding: 12px 10px;
      background: #0b141a;
      background-image: none
    }

    .row {
      display: flex;
      margin: 6px 0
    }

    .row.me {
      justify-content: flex-end
    }

    .row.them {
      justify-content: flex-start
    }

    .bubble {
      max-width: 78%;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 14.5px;
      line-height: 1.35;
      word-wrap: break-word
    }

    .row.me .bubble {
      background: #005c4b;
      color: #e9edef;
      border-top-right-radius: 0
    }

    .row.them .bubble {
      background: #1f2c34;
      color: #e9edef;
      border-top-left-radius: 0
    }

    .bubble img {
      max-width: 100%;
      border-radius: 6px;
      display: block;
      margin-top: 4px
    }

    .time {
      font-size: 11px;
      color: #8696a0;
      margin-top: 4px;
      text-align: right
    }

    .compose {
      display: flex;
      gap: 8px;
      padding: 8px 10px;
      background: #1f2c34;
      flex-shrink: 0;
      align-items: center
    }

    .compose input[type=text] {
      flex: 1;
      margin: 0
    }

    .compose button {
      width: auto;
      margin: 0;
      padding: 10px 14px
    }

    #unlockModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .65);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 16px
    }

    #unlockModal.show {
      display: flex
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="head">
      <strong>· Chat</strong>
      <a href="/admin.html">Admin login</a>
    </div>

    <div id="pinGate">
      <div class="card">
        <h1>Chat access</h1>
        <p>Enter chat PIN </p>
        <input id="gatePin" type="password" inputmode="numeric" maxlength="8" placeholder="Chat PIN">
        <button type="button" id="gateBtn">Enter</button>
        <p class="err" id="gateErr"></p>
      </div>
    </div>

    <div id="app">
      <div id="listView"></div>
      <div id="chatView">
        <div class="chatHead">
          <button type="button" id="backBtn">←</button>
          <div class="title" id="chatTitle">Chat</div>
        </div>
        <div class="msgs" id="msgs"></div>
        <div class="compose">
          <input type="file" id="photo" accept="image/*" hidden>
          <button type="button" id="photoBtn">📷</button>
          <input type="text" id="reply" placeholder="Message">
          <button type="button" id="sendBtn">Send</button>
        </div>
      </div>
    </div>
  </div>

  <div id="unlockModal">
    <div class="card">
      <h1 style="font-size:18px">Shipment PIN</h1>
      <p>Enter the 4-digit PIN for this tracking code to open the conversation.</p>
      <input id="shipPin" type="password" inputmode="numeric" maxlength="8" placeholder="Shipment PIN">
      <button type="button" id="unlockBtn">Unlock chat</button>
      <button type="button" class="danger" id="unlockCancel">Cancel</button>
      <p class="err" id="unlockErr"></p>
    </div>
  </div>

  <script>
    (function () {
      var API = 'https://my-delivery-w6xz.onrender.com/api';
      var chatPin = sessionStorage.getItem('demoChatPin') || '';
      var adminTok = sessionStorage.getItem('dhlAdminToken') || '';
      var selectedId = null;
      var pendingId = null;
      var unlocked = {}; // threadId -> true for this session

      function headers(extra) {
        var h = Object.assign({ 'Content-Type': 'application/json', 'X-Chat-Pin': chatPin }, extra || {});
        if (adminTok) h.Authorization = 'Bearer ' + adminTok;
        return h;
      }
      function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
      function fmtTime(d) {
        try {
          var t = new Date(d);
          if (isNaN(t)) return '';
          return t.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        } catch (e) { return ''; }
      }

      async function enterGate() {
        var pin = document.getElementById('gatePin').value.trim();
        document.getElementById('gateErr').textContent = '';
        try {
          var r = await fetch(API + '/chat/chat-pin', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pin: pin })
          });
          var d = await r.json().catch(function () { return {}; });
          if (!r.ok) throw new Error(d.error || 'Wrong PIN');
          chatPin = pin;
          sessionStorage.setItem('demoChatPin', pin);
          openApp();
        } catch (e) {
          if (pin === '4422') { chatPin = '4422'; sessionStorage.setItem('demoChatPin', '4422'); openApp(); }
          else document.getElementById('gateErr').textContent = e.message || 'Wrong PIN';
        }
      }

      function openApp() {
        document.getElementById('pinGate').style.display = 'none';
        document.getElementById('app').classList.add('on');
        loadList();
        setInterval(function () { if (!selectedId) loadList(); else loadMsgs(false); }, 7000);
      }

      async function loadList() {
        var box = document.getElementById('listView');
        try {
          var r = await fetch(API + '/chat/admin/threads', { headers: headers() });
          var d = await r.json();
          if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
          var list = d.threads || [];
          if (!list.length) {
            box.innerHTML = '<p style="padding:16px;color:#8696a0;font-size:14px">No chats yet. Customer must open Customer Service on the main site, enter a valid tracking code, and send a message.</p>';
            return;
          }
          box.innerHTML = list.map(function (t) {
            return '<button type="button" class="thread" data-id="' + esc(t.id) + '" data-label="' + esc(t.label || t.trackCode || 'Chat') + '" data-code="' + esc(t.trackCode || '') + '">'
              + '<strong>' + esc(t.label || t.trackCode || 'Chat') + '</strong>'
              + '<small>' + esc(t.preview || '') + (t.trackCode ? ' · ' + esc(t.trackCode) : '') + '</small></button>';
          }).join('');
          box.querySelectorAll('.thread').forEach(function (btn) {
            btn.onclick = function () { tryOpen(btn.getAttribute('data-id'), btn.getAttribute('data-label')); };
          });
        } catch (e) {
          box.innerHTML = '<p style="padding:16px;color:#f87171">' + esc(e.message) + '</p>';
        }
      }

      function tryOpen(id, label) {
        pendingId = id;
        document.getElementById('chatTitle').textContent = label || 'Chat';
        if (unlocked[id]) {
          selectedId = id;
          showChat();
          loadMsgs(true);
          return;
        }
        document.getElementById('shipPin').value = '';
        document.getElementById('unlockErr').textContent = '';
        document.getElementById('unlockModal').classList.add('show');
      }

      async function doUnlock() {
        var pin = document.getElementById('shipPin').value.trim();
        document.getElementById('unlockErr').textContent = '';
        try {
          var r = await fetch(API + '/chat/admin/unlock-thread', {
            method: 'POST',
            headers: headers(),
            body: JSON.stringify({ threadId: pendingId, pin: pin, password: pin })
          });
          var d = await r.json();
          if (!r.ok) throw new Error(d.error || 'Wrong PIN');
          unlocked[pendingId] = true;
          selectedId = pendingId;
          document.getElementById('unlockModal').classList.remove('show');
          showChat();
          renderMsgs(d.messages || []);
        } catch (e) {
          // If shipment has no PIN, backend may still allow — try direct open
          if (/no pin|not found/i.test(e.message)) {
            unlocked[pendingId] = true;
            selectedId = pendingId;
            document.getElementById('unlockModal').classList.remove('show');
            showChat();
            loadMsgs(true);
          } else {
            document.getElementById('unlockErr').textContent = e.message;
          }
        }
      }

      function showChat() {
        document.getElementById('listView').style.display = 'none';
        document.getElementById('chatView').classList.add('on');
      }
      function showList() {
        selectedId = null;
        document.getElementById('chatView').classList.remove('on');
        document.getElementById('listView').style.display = 'block';
        loadList();
      }

      function renderMsgs(msgs) {
        var box = document.getElementById('msgs');
        box.innerHTML = (msgs || []).map(function (m) {
          var me = m.from === 'admin';
          var img = m.image ? '<img src="' + m.image + '" alt="" onclick="window.open(this.src)">' : '';
          return '<div class="row ' + (me ? 'me' : 'them') + '"><div class="bubble">'
            + (m.text ? esc(m.text) : '') + img
            + '<div class="time">' + fmtTime(m.createdAt) + '</div></div></div>';
        }).join('') || '<p style="color:#8696a0;text-align:center">No messages</p>';
        box.scrollTop = box.scrollHeight;
      }

      async function loadMsgs(force) {
        if (!selectedId) return;
        try {
          // Prefer unlock cache path: get thread
          var r = await fetch(API + '/chat/admin/threads/' + selectedId, { headers: headers() });
          var d = await r.json();
          if (!r.ok) throw new Error(d.error || 'Failed');
          renderMsgs(d.messages || []);
        } catch (e) {
          if (force) document.getElementById('msgs').innerHTML = '<p style="color:#f87171;padding:12px">' + esc(e.message) + '</p>';
        }
      }

      async function send(text, image) {
        if (!selectedId) return;
        if (!text && !image) return;
        try {
          var r = await fetch(API + '/chat/admin/threads/' + selectedId + '/reply', {
            method: 'POST',
            headers: headers(),
            body: JSON.stringify({ text: text || '', image: image || '' })
          });
          var d = await r.json();
          if (!r.ok) throw new Error(d.error || 'Send failed');
          document.getElementById('reply').value = '';
          renderMsgs(d.messages || []);
        } catch (e) { alert(e.message); }
      }

      document.getElementById('gateBtn').onclick = enterGate;
      document.getElementById('backBtn').onclick = showList;
      document.getElementById('unlockBtn').onclick = doUnlock;
      document.getElementById('unlockCancel').onclick = function () {
        document.getElementById('unlockModal').classList.remove('show');
        pendingId = null;
      };
      document.getElementById('sendBtn').onclick = function () {
        send(document.getElementById('reply').value.trim(), '');
      };
      document.getElementById('reply').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); send(this.value.trim(), ''); }
      });
      document.getElementById('photoBtn').onclick = function () { document.getElementById('photo').click(); };
      document.getElementById('photo').onchange = function (ev) {
        var f = ev.target.files && ev.target.files[0];
        if (!f) return;
        var reader = new FileReader();
        reader.onload = function () { send('', reader.result); };
        reader.readAsDataURL(f);
        ev.target.value = '';
      };

      if (chatPin) document.getElementById('gatePin').value = chatPin;
    })();
  </script>
</body>

</html>
