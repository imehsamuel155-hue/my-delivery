<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHL Shipping Box</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #ddd;
            font-family: Arial, system-ui, sans-serif;
            color: #111;
        }

        .topbar {
            background: #FFCC00;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #D40511;
        }

        .topbar b {
            color: #D40511;
            font-size: 24px;
            font-weight: 900;
        }

        .topbar a {
            color: #111;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
        }

        .wrap {
            max-width: 520px;
            margin: 0 auto;
            padding: 14px 10px 40px;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        input[type="text"] {
            flex: 1;
            min-width: 120px;
            padding: 11px;
            border: 1px solid #bbb;
            border-radius: 4px;
            font-size: 14px;
        }

        .btn {
            padding: 11px 14px;
            border: none;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-red {
            background: #D40511;
            color: #fff;
        }

        .btn-out {
            background: #fff;
            border: 1px solid #333;
        }

        .btn:disabled {
            opacity: .4;
        }

        .pick {
            background: #fff;
            border: 2px dashed #aaa;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .msg {
            font-size: 13px;
            margin: 8px 0 12px;
            color: #555;
        }

        .wait {
            display: none;
            text-align: center;
            padding: 18px;
            background: #fff;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .wait.on {
            display: block;
        }

        /* ONLY your photo — no extra yellow design */
        .pkg {
            position: relative;
            width: 100%;
            line-height: 0;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
        }

        .pkg img {
            width: 100%;
            height: auto;
            display: block;
        }

        /*
      White label sits on the sticker area of YOUR photo (the area you circled).
      Opaque white covers the printed French text; admin receiver data is written on top.
    */
        .sticker {
            position: absolute;
            left: 12%;
            top: 41%;
            width: 52%;
            background: #ffffff;
            border: 1px solid #333;
            line-height: 1.2;
            font-size: clamp(9px, 2.6vw, 12.5px);
            box-shadow: 0 1px 4px rgba(0, 0, 0, .2);
        }

        .sticker .h {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 6px;
            background: #f2f2f2;
            border-bottom: 1px solid #ccc;
            font-size: 0.8em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .3px;
        }

        .sticker .bc {
            width: 42px;
            height: 11px;
            background: repeating-linear-gradient(90deg, #111 0 1.5px, #fff 1.5px 3px);
        }

        .sticker table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
        }

        .sticker td {
            padding: 4px 6px;
            border-bottom: 1px solid #ddd;
            vertical-align: top;
        }

        .sticker tr:last-child td {
            border-bottom: none;
        }

        .sticker td.k {
            width: 42%;
            color: #444;
            font-weight: 600;
            background: #fafafa;
        }

        .sticker td.v {
            font-weight: 700;
            word-break: break-word;
        }

        @media print {

            .topbar,
            .row,
            .pick,
            .msg,
            .wait,
            .no-print {
                display: none !important;
            }

            body {
                background: #fff;
            }

            .pkg {
                box-shadow: none;
            }
        }
    </style>
</head>

<body>
    <div class="topbar no-print">
        <b>DHL</b>
        <a href="/">← Back to track</a>
    </div>

    <div class="wrap">
        <div class="row no-print">
            <input type="text" id="boxCode" placeholder="Tracking code">
            <button class="btn btn-red" type="button" id="boxLoadBtn">Show box</button>
            <button class="btn btn-out" type="button" id="boxPrintBtn" disabled>Print</button>
        </div>

        <div class="pick no-print">
            <div style="font-weight:700;margin-bottom:4px;">QR from gallery</div>
            <div style="color:#666;margin-bottom:8px;">Use the QR you saved from Track. Correct code → this package
                photo with receiver details on the white label.</div>
            <input type="file" id="qrFile" accept="image/*">
        </div>

        <div class="wait" id="pleaseWait">
            <div id="waitDots">......</div>
            <div style="margin-top:6px;font-weight:700;">Please wait</div>
        </div>
        <p class="msg no-print" id="boxMsg">Enter code or upload QR.</p>

        <div id="boxOut"></div>
    </div>

    <script>
        const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
            ? 'http://localhost:5000/api'
            : 'https://my-delivery-w6xz.onrender.com/api';

        // YOUR DHL box photo. Replace this file anytime:
        //   public/images/dhl-box-photo.jpg
        const BOX_IMG = '/images/dhl-box-photo.jpg';

        let _t = null;
        function showWait() {
            document.getElementById('pleaseWait').classList.add('on');
            let n = 0; const d = document.getElementById('waitDots');
            if (_t) clearInterval(_t);
            _t = setInterval(() => { n = (n % 6) + 1; if (d) d.textContent = '.'.repeat(n); }, 280);
        }
        function hideWait() {
            document.getElementById('pleaseWait').classList.remove('on');
            if (_t) { clearInterval(_t); _t = null; }
        }
        function esc(s) {
            return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function splitName(full) {
            const p = String(full || '').trim().split(/\s+/).filter(Boolean);
            if (!p.length) return { first: '—', last: '—' };
            if (p.length === 1) return { first: p[0], last: '—' };
            return { first: p.slice(0, -1).join(' '), last: p[p.length - 1] };
        }
        function parseAddr(addr) {
            const parts = String(addr || '').split(',').map(x => x.trim()).filter(Boolean);
            if (!parts.length) return { country: '—', city: '—', district: '—' };
            if (parts.length === 1) return { country: parts[0], city: '—', district: '—' };
            if (parts.length === 2) return { country: parts[1], city: parts[0], district: '—' };
            return { country: parts[parts.length - 1], city: parts[parts.length - 2], district: parts.slice(0, -2).join(', ') };
        }
        function extractCode(raw) {
            const text = String(raw || '').trim();
            try { const c = new URL(text).searchParams.get('code'); if (c) return c.trim(); } catch (_) { }
            const m = text.match(/DHL[A-Za-z0-9]+/i);
            if (m) return m[0];
            if (/^[A-Za-z0-9\-_]{5,32}$/.test(text)) return text;
            return '';
        }

        function renderBox(s) {
            const r = s.receiver || {};
            const name = splitName(r.name);
            const addr = parseAddr(r.address);
            return `
      <div class="pkg" id="printBox">
        <img src="${BOX_IMG}" alt="DHL box">
        <div class="sticker">
          <div class="h"><span>Receiver information</span><span class="bc"></span></div>
          <table>
            <tr><td class="k">Last name</td><td class="v">${esc(name.last)}</td></tr>
            <tr><td class="k">First name</td><td class="v">${esc(name.first)}</td></tr>
            <tr><td class="k">Country</td><td class="v">${esc(addr.country)}</td></tr>
            <tr><td class="k">City</td><td class="v">${esc(addr.city)}</td></tr>
            <tr><td class="k">District</td><td class="v">${esc(addr.district)}</td></tr>
            <tr><td class="k">Phone</td><td class="v">${esc(r.phone || '—')}</td></tr>
            <tr><td class="k">Tracking</td><td class="v">${esc(s.code)}</td></tr>
          </table>
        </div>
      </div>`;
        }

        async function loadBox(code) {
            const msg = document.getElementById('boxMsg');
            const out = document.getElementById('boxOut');
            const printBtn = document.getElementById('boxPrintBtn');
            printBtn.disabled = true;
            out.innerHTML = '';
            code = String(code || '').trim();
            if (!code) {
                msg.style.color = '#D40511';
                msg.textContent = 'Enter a tracking code or upload a QR.';
                return;
            }
            showWait();
            msg.style.color = '#555';
            msg.textContent = 'Please wait…';
            try {
                const res = await fetch(API + '/shipments/track/' + encodeURIComponent(code));
                const s = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(s.error || 'Invalid code');
                out.innerHTML = renderBox(s);
                printBtn.disabled = false;
                document.getElementById('boxCode').value = s.code;
                msg.style.color = '#1F9D55';
                msg.textContent = 'Package ready. Admin receiver details are on the white label.';
                history.replaceState(null, '', '/box.html?code=' + encodeURIComponent(s.code));
            } catch (e) {
                msg.style.color = '#D40511';
                msg.textContent = e.message || 'Failed';
            } finally {
                hideWait();
            }
        }

        function decodeQr(file) {
            return new Promise((resolve, reject) => {
                if (typeof jsQR !== 'function') return reject(new Error('QR reader not loaded'));
                const fr = new FileReader();
                fr.onload = () => {
                    const img = new Image();
                    img.onload = () => {
                        const c = document.createElement('canvas');
                        const max = 1400;
                        let w = img.width, h = img.height;
                        if (Math.max(w, h) > max) {
                            const sc = max / Math.max(w, h);
                            w = Math.round(w * sc); h = Math.round(h * sc);
                        }
                        c.width = w; c.height = h;
                        const ctx = c.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        const data = ctx.getImageData(0, 0, w, h);
                        const r = jsQR(data.data, data.width, data.height, { inversionAttempts: 'attemptBoth' });
                        if (!r || !r.data) reject(new Error('No QR in image'));
                        else resolve(r.data);
                    };
                    img.onerror = () => reject(new Error('Bad image'));
                    img.src = fr.result;
                };
                fr.onerror = () => reject(new Error('Read failed'));
                fr.readAsDataURL(file);
            });
        }

        document.getElementById('qrFile').onchange = async (e) => {
            const f = e.target.files && e.target.files[0];
            if (!f) return;
            showWait();
            try {
                const code = extractCode(await decodeQr(f));
                if (!code) throw new Error('No tracking code in QR');
                await loadBox(code);
            } catch (err) {
                hideWait();
                document.getElementById('boxMsg').style.color = '#D40511';
                document.getElementById('boxMsg').textContent = err.message || 'QR failed';
            }
            e.target.value = '';
        };

        document.getElementById('boxLoadBtn').onclick = () => loadBox(document.getElementById('boxCode').value);
        document.getElementById('boxCode').onkeydown = (e) => { if (e.key === 'Enter') loadBox(document.getElementById('boxCode').value); };
        document.getElementById('boxPrintBtn').onclick = () => window.print();

        const q = new URLSearchParams(location.search).get('code');
        if (q) { document.getElementById('boxCode').value = q; loadBox(q); }
    </script>
</body>

</html>
