<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHL Box</title>
    <link rel="icon" href="https://commons.wikimedia.org/wiki/Special:FilePath/DHL_Express.svg">
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            background: #e8e8e8;
            font-family: Arial, sans-serif
        }

        .bar {
            background: #FFCC00;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #D40511
        }

        .bar b {
            color: #D40511;
            font-size: 22px
        }

        .bar a {
            color: #111;
            font-weight: 600;
            text-decoration: none;
            font-size: 14px
        }

        .wrap {
            max-width: 560px;
            margin: 0 auto;
            padding: 14px
        }

        .pick {
            background: #fff;
            border: 1px dashed #aaa;
            padding: 16px;
            text-align: center;
            font-size: 13px;
            margin-bottom: 12px;
            border-radius: 8px
        }

        .btn {
            margin-top: 10px;
            padding: 12px 18px;
            background: #D40511;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer
        }

        .msg {
            font-size: 13px;
            margin: 8px 0;
            color: #555
        }

        .wait {
            display: none;
            text-align: center;
            padding: 16px;
            background: #fff;
            margin-bottom: 8px;
            border-radius: 6px
        }

        .wait.on {
            display: block
        }

        #out canvas {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            box-shadow: 0 6px 20px rgba(0, 0, 0, .15)
        }
    </style>
</head>

<body>
    <div class="bar"><b>DHL</b><a href="/">Back</a></div>
    <div class="wrap">
        <div class="pick">
            <strong>QR from gallery only</strong>
            <p style="margin-top:8px;color:#666;font-size:12px;">Scan the QR saved from Track or Receipt. Correct QR
                shows the package with admin receiver details on the sticker.</p>
            <input type="file" id="file" accept="image/*" style="display:block;margin:12px auto 0;">
            <button type="button" class="btn" id="go">Show box</button>
        </div>
        <div class="wait" id="wait"><b id="dots">......</b>
            <div>Please wait</div>
        </div>
        <p class="msg" id="msg"></p>
        <div id="out"></div>
    </div>
    <script>
        const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
            ? 'http://localhost:5000/api' : 'https://my-delivery-w6xz.onrender.com/api';
        const PHOTO = '/images/dhl-box-photo.jpg';
        /* Exact area of the printed INFORMATIONS DESTINATAIRE sticker on your photo */
        const LABEL = { x: 0.12, y: 0.42, w: 0.52, h: 0.32 };

        function splitName(n) {
            const p = String(n || '').trim().split(/\s+/).filter(Boolean);
            if (!p.length) return { first: '', last: '' };
            if (p.length === 1) return { first: p[0], last: '' };
            return { first: p.slice(0, -1).join(' '), last: p[p.length - 1] };
        }
        function parseAddr(a) {
            const p = String(a || '').split(',').map(x => x.trim()).filter(Boolean);
            if (!p.length) return { country: '', city: '', district: '' };
            if (p.length === 1) return { country: p[0], city: '', district: '' };
            if (p.length === 2) return { country: p[1], city: p[0], district: '' };
            return { country: p[p.length - 1], city: p[p.length - 2], district: p.slice(0, -2).join(', ') };
        }
        function v(x) { const s = String(x || '').trim(); return s || '//'; }
        function extract(raw) {
            const t = String(raw || '').trim();
            try { const c = new URL(t).searchParams.get('code'); if (c) return c.trim(); } catch (e) { }
            const m = t.match(/DHL[A-Za-z0-9]+/i); if (m) return m[0];
            if (/^[A-Za-z0-9\-_]{5,40}$/.test(t)) return t;
            return '';
        }

        /** Fill the EXISTING sticker on the package photo — same place as Nom/Prénom (Adam, Faroukou). No extra floating card. */
        function paintBox(ship) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const cv = document.createElement('canvas');
                    cv.width = img.naturalWidth; cv.height = img.naturalHeight;
                    const ctx = cv.getContext('2d');
                    ctx.drawImage(img, 0, 0);

                    const x = cv.width * LABEL.x, y = cv.height * LABEL.y, w = cv.width * LABEL.w, h = cv.height * LABEL.h;

                    // Cover only the printed sticker (French text) — keep white label look of the package
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(x, y, w, h);
                    ctx.strokeStyle = '#222';
                    ctx.lineWidth = Math.max(1, cv.width * 0.0012);
                    ctx.strokeRect(x, y, w, h);

                    // Header like original INFORMATIONS DESTINATAIRE
                    const hh = h * 0.14;
                    ctx.fillStyle = '#f7f7f7';
                    ctx.fillRect(x, y, w * 0.72, hh);
                    ctx.strokeStyle = '#ccc';
                    ctx.beginPath(); ctx.moveTo(x, y + hh); ctx.lineTo(x + w, y + hh); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(x + w * 0.72, y); ctx.lineTo(x + w * 0.72, y + hh); ctx.stroke();
                    ctx.fillStyle = '#222';
                    ctx.font = 'bold ' + Math.floor(hh * 0.38) + 'px Arial';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('RECEIVER INFORMATION', x + w * 0.02, y + hh / 2);
                    // barcode block top-right of label
                    const bx = x + w * 0.74, by = y + hh * 0.2, bw = w * 0.22, bh = hh * 0.6;
                    for (let i = 0; i < 20; i++) {
                        if (i % 2 === 0) { ctx.fillStyle = '#111'; ctx.fillRect(bx + (bw / 20) * i, by, bw / 20 * 0.6, bh); }
                    }

                    const r = ship.receiver || {};
                    const nm = splitName(r.name);
                    const ad = parseAddr(r.address);
                    // Same rows as package: Nom, Prénom, Pays, Ville, Quartier, Téléphone
                    const rows = [
                        ['Last name (Nom)', v(nm.last)],
                        ['First name (Prénom)', v(nm.first)],
                        ['Country (Pays)', v(ad.country)],
                        ['City (Ville)', v(ad.city)],
                        ['District (Quartier)', v(ad.district)],
                        ['Phone (Téléphone)', v(r.phone)]
                    ];
                    const body = h - hh, rh = body / rows.length, col = w * 0.42;
                    const fs = Math.max(9, Math.floor(rh * 0.34));
                    rows.forEach((row, i) => {
                        const ry = y + hh + rh * i;
                        ctx.strokeStyle = '#ccc';
                        ctx.beginPath(); ctx.moveTo(x, ry); ctx.lineTo(x + w, ry); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(x + col, ry); ctx.lineTo(x + col, ry + rh); ctx.stroke();
                        ctx.fillStyle = '#333'; ctx.font = 'bold ' + fs + 'px Arial'; ctx.textBaseline = 'middle';
                        ctx.fillText(row[0], x + w * 0.015, ry + rh / 2);
                        ctx.fillStyle = '#000';
                        let t = row[1];
                        while (ctx.measureText(t).width > w - col - w * 0.03 && t.length > 2) t = t.slice(0, -2);
                        if (t !== row[1]) t += '…';
                        ctx.fillText(t, x + col + w * 0.015, ry + rh / 2);
                    });
                    resolve(cv);
                };
                img.onerror = () => reject(new Error('Missing public/images/dhl-box-photo.jpg'));
                img.src = PHOTO + '?v=' + Date.now();
            });
        }

        let timer = null, lastCode = '';
        function showWait() { document.getElementById('wait').classList.add('on'); let n = 0; clearInterval(timer); timer = setInterval(() => { n = n % 6 + 1; document.getElementById('dots').textContent = '.'.repeat(n); }, 280); }
        function hideWait() { document.getElementById('wait').classList.remove('on'); clearInterval(timer); }

        async function load(code) {
            const msg = document.getElementById('msg'), out = document.getElementById('out');
            out.innerHTML = ''; code = String(code || '').trim();
            if (!code) { msg.style.color = '#D40511'; msg.textContent = 'Choose a QR from gallery first.'; return; }
            showWait(); msg.style.color = '#555'; msg.textContent = 'Please wait…';
            try {
                const res = await fetch(API + '/shipments/track/' + encodeURIComponent(code));
                const s = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(s.error || 'Invalid QR / code');
                lastCode = s.code;
                out.appendChild(await paintBox(s));
                msg.style.color = '#1F9D55';
                msg.textContent = 'Package ready. Receiver details from admin are on the box sticker.';
            } catch (e) { msg.style.color = '#D40511'; msg.textContent = e.message || 'Failed'; }
            finally { hideWait(); }
        }

        document.getElementById('go').onclick = () => { if (lastCode) load(lastCode); else document.getElementById('msg').textContent = 'Choose a QR from gallery first.'; };
        document.getElementById('file').onchange = async e => {
            const f = e.target.files && e.target.files[0]; if (!f) return;
            showWait();
            try {
                if (typeof jsQR !== 'function') throw new Error('QR reader not loaded');
                const data = await new Promise((res, rej) => {
                    const fr = new FileReader();
                    fr.onload = () => {
                        const im = new Image();
                        im.onload = () => {
                            const c = document.createElement('canvas'); let w = im.width, h = im.height, max = 1400;
                            if (Math.max(w, h) > max) { const sc = max / Math.max(w, h); w = Math.round(w * sc); h = Math.round(h * sc); }
                            c.width = w; c.height = h; c.getContext('2d').drawImage(im, 0, 0, w, h);
                            const id = c.getContext('2d').getImageData(0, 0, w, h);
                            const r = jsQR(id.data, id.width, id.height, { inversionAttempts: 'attemptBoth' });
                            if (!r || !r.data) rej(new Error('No QR found')); else res(r.data);
                        };
                        im.onerror = () => rej(new Error('Bad image')); im.src = fr.result;
                    };
                    fr.onerror = () => rej(new Error('Read failed')); fr.readAsDataURL(f);
                });
                const code = extract(data);
                if (!code) throw new Error('No tracking code in this QR');
                lastCode = code;
                await load(code);
            } catch (err) { hideWait(); document.getElementById('msg').style.color = '#D40511'; document.getElementById('msg').textContent = err.message || 'QR failed'; }
            e.target.value = '';
        };
    </script>
</body>

</html>
