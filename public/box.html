<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHL Shipping Box</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #e8e8e8;
            font-family: Arial, Helvetica, sans-serif;
            color: #111;
        }

        .topbar {
            background: #FFCC00;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #D40511;
        }

        .topbar b {
            color: #D40511;
            font-size: 22px;
            font-weight: 900;
        }

        .topbar a {
            color: #111;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
        }

        .wrap {
            max-width: 560px;
            margin: 0 auto;
            padding: 12px 10px 40px;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        input[type="text"] {
            flex: 1;
            min-width: 120px;
            padding: 10px;
            border: 1px solid #bbb;
            border-radius: 4px;
            font-size: 14px;
        }

        .btn {
            padding: 10px 14px;
            border: none;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-red {
            background: #D40511;
            color: #fff;
        }

        .btn-out {
            background: #fff;
            border: 1px solid #333;
        }

        .btn:disabled {
            opacity: .4;
        }

        .pick {
            background: #fff;
            border: 1px dashed #aaa;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 12px;
            text-align: center;
            border-radius: 6px;
        }

        .msg {
            font-size: 13px;
            margin: 8px 0;
            color: #555;
        }

        .wait {
            display: none;
            text-align: center;
            padding: 16px;
            background: #fff;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .wait.on {
            display: block;
        }

        #boxOut {
            text-align: center;
        }

        #boxOut canvas,
        #boxOut img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .2);
        }

        @media print {

            .topbar,
            .row,
            .pick,
            .msg,
            .wait,
            .no-print {
                display: none !important;
            }

            body {
                background: #fff;
            }

            #boxOut canvas,
            #boxOut img {
                box-shadow: none;
            }
        }
    </style>
</head>

<body>
    <div class="topbar no-print">
        <b>DHL</b>
        <a href="/">← Back to track</a>
    </div>

    <div class="wrap">
        <div class="row no-print">
            <input type="text" id="boxCode" placeholder="Tracking code">
            <button class="btn btn-red" type="button" id="boxLoadBtn">Show box</button>
            <button class="btn btn-out" type="button" id="boxPrintBtn" disabled>Print</button>
        </div>
        <div class="pick no-print">
            QR from gallery
            <input type="file" id="qrFile" accept="image/*" style="display:block;margin:8px auto 0;">
        </div>
        <div class="wait" id="pleaseWait"><span id="waitDots">......</span>
            <div style="margin-top:6px;font-weight:700;">Please wait</div>
        </div>
        <p class="msg no-print" id="boxMsg">Enter code or upload QR.</p>
        <div id="boxOut"></div>
    </div>

    <script>
        const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
            ? 'http://localhost:5000/api'
            : 'https://my-delivery-w6xz.onrender.com/api';

        // Your package photo — the white sticker on this image is where text is written
        const BOX_IMG = '/images/dhl-box-photo.jpg';

        /*
          Sticker region on the photo (percent of image size).
          Matches the printed white label on your DHL box picture.
        */
        const STICKER = {
            x: 0.145,   // left
            y: 0.455,   // top
            w: 0.455,   // width
            h: 0.265    // height
        };

        let _t = null;
        function showWait() {
            document.getElementById('pleaseWait').classList.add('on');
            let n = 0; const d = document.getElementById('waitDots');
            if (_t) clearInterval(_t);
            _t = setInterval(() => { n = (n % 6) + 1; if (d) d.textContent = '.'.repeat(n); }, 280);
        }
        function hideWait() {
            document.getElementById('pleaseWait').classList.remove('on');
            if (_t) { clearInterval(_t); _t = null; }
        }
        function esc(s) {
            return String(s == null ? '' : s);
        }
        function splitName(full) {
            const p = String(full || '').trim().split(/\s+/).filter(Boolean);
            if (!p.length) return { first: '', last: '' };
            if (p.length === 1) return { first: p[0], last: '' };
            return { first: p.slice(0, -1).join(' '), last: p[p.length - 1] };
        }
        function parseAddr(addr) {
            const parts = String(addr || '').split(',').map(x => x.trim()).filter(Boolean);
            if (!parts.length) return { country: '', city: '', district: '' };
            if (parts.length === 1) return { country: parts[0], city: '', district: '' };
            if (parts.length === 2) return { country: parts[1], city: parts[0], district: '' };
            return {
                country: parts[parts.length - 1],
                city: parts[parts.length - 2],
                district: parts.slice(0, -2).join(', ')
            };
        }
        function extractCode(raw) {
            const text = String(raw || '').trim();
            try { const c = new URL(text).searchParams.get('code'); if (c) return c.trim(); } catch (_) { }
            const m = text.match(/DHL[A-Za-z0-9]+/i);
            if (m) return m[0];
            if (/^[A-Za-z0-9\-_]{5,32}$/.test(text)) return text;
            return '';
        }
        function val(v) {
            const s = String(v || '').trim();
            return s || '—';
        }

        /**
         * Draw the package photo and write receiver details ON the existing white sticker
         * (same place as on the real box). No separate HTML card.
         */
        function drawPackageBox(shipment) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.naturalWidth || img.width;
                    canvas.height = img.naturalHeight || img.height;
                    const ctx = canvas.getContext('2d');

                    // 1) Full package photo
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    // 2) Sticker rectangle on the photo
                    const x = canvas.width * STICKER.x;
                    const y = canvas.height * STICKER.y;
                    const w = canvas.width * STICKER.w;
                    const h = canvas.height * STICKER.h;

                    // Cover original printed text (keep white sticker look)
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(x, y, w, h);
                    ctx.strokeStyle = '#333333';
                    ctx.lineWidth = Math.max(1, canvas.width * 0.0015);
                    ctx.strokeRect(x, y, w, h);

                    // Header bar like the real label
                    const headerH = h * 0.14;
                    ctx.fillStyle = '#f3f3f3';
                    ctx.fillRect(x, y, w, headerH);
                    ctx.strokeStyle = '#cccccc';
                    ctx.beginPath();
                    ctx.moveTo(x, y + headerH);
                    ctx.lineTo(x + w, y + headerH);
                    ctx.stroke();

                    ctx.fillStyle = '#222222';
                    ctx.font = 'bold ' + Math.floor(headerH * 0.45) + 'px Arial';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('RECEIVER INFORMATION', x + w * 0.03, y + headerH / 2);

                    // Small barcode block (right of header) like the photo
                    const bcW = w * 0.18;
                    const bcH = headerH * 0.55;
                    const bcX = x + w - bcW - w * 0.03;
                    const bcY = y + (headerH - bcH) / 2;
                    for (let i = 0; i < 18; i++) {
                        if (i % 2 === 0) {
                            ctx.fillStyle = '#111';
                            ctx.fillRect(bcX + (bcW / 18) * i, bcY, bcW / 18 * 0.7, bcH);
                        }
                    }

                    // Rows — same structure as the package sticker
                    const r = shipment.receiver || {};
                    const name = splitName(r.name);
                    const addr = parseAddr(r.address);
                    const rows = [
                        ['Last name', val(name.last)],
                        ['First name', val(name.first)],
                        ['Country', val(addr.country)],
                        ['City', val(addr.city)],
                        ['District', val(addr.district)],
                        ['Phone', val(r.phone)]
                    ];

                    const bodyTop = y + headerH;
                    const bodyH = h - headerH;
                    const rowH = bodyH / rows.length;
                    const col1 = w * 0.36;
                    const fontSize = Math.max(10, Math.floor(rowH * 0.38));

                    rows.forEach((row, i) => {
                        const ry = bodyTop + rowH * i;
                        // horizontal line
                        ctx.strokeStyle = '#cccccc';
                        ctx.beginPath();
                        ctx.moveTo(x, ry);
                        ctx.lineTo(x + w, ry);
                        ctx.stroke();
                        // vertical split
                        ctx.beginPath();
                        ctx.moveTo(x + col1, ry);
                        ctx.lineTo(x + col1, ry + rowH);
                        ctx.stroke();

                        ctx.fillStyle = '#333333';
                        ctx.font = 'bold ' + fontSize + 'px Arial';
                        ctx.textAlign = 'left';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(row[0], x + w * 0.025, ry + rowH / 2);

                        ctx.fillStyle = '#000000';
                        ctx.font = 'bold ' + fontSize + 'px Arial';
                        // fit long text
                        let text = row[1];
                        const maxTw = w - col1 - w * 0.05;
                        while (ctx.measureText(text).width > maxTw && text.length > 3) {
                            text = text.slice(0, -2);
                        }
                        if (text !== row[1]) text += '…';
                        ctx.fillText(text, x + col1 + w * 0.025, ry + rowH / 2);
                    });

                    resolve(canvas);
                };
                img.onerror = () => reject(new Error('Could not load box photo. Check public/images/dhl-box-photo.jpg'));
                img.src = BOX_IMG + '?t=' + Date.now();
            });
        }

        async function loadBox(code) {
            const msg = document.getElementById('boxMsg');
            const out = document.getElementById('boxOut');
            const printBtn = document.getElementById('boxPrintBtn');
            printBtn.disabled = true;
            out.innerHTML = '';
            code = String(code || '').trim();
            if (!code) {
                msg.style.color = '#D40511';
                msg.textContent = 'Enter a tracking code or upload a QR.';
                return;
            }
            showWait();
            msg.style.color = '#555';
            msg.textContent = 'Please wait…';
            try {
                const res = await fetch(API + '/shipments/track/' + encodeURIComponent(code));
                const s = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(s.error || 'Invalid code');
                const canvas = await drawPackageBox(s);
                out.innerHTML = '';
                out.appendChild(canvas);
                printBtn.disabled = false;
                document.getElementById('boxCode').value = s.code;
                msg.style.color = '#1F9D55';
                msg.textContent = 'Package ready. Receiver details are written on the box label.';
                history.replaceState(null, '', '/box.html?code=' + encodeURIComponent(s.code));
            } catch (e) {
                msg.style.color = '#D40511';
                msg.textContent = e.message || 'Failed';
            } finally {
                hideWait();
            }
        }

        function decodeQr(file) {
            return new Promise((resolve, reject) => {
                if (typeof jsQR !== 'function') return reject(new Error('QR reader not loaded'));
                const fr = new FileReader();
                fr.onload = () => {
                    const img = new Image();
                    img.onload = () => {
                        const c = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        const max = 1400;
                        if (Math.max(w, h) > max) {
                            const sc = max / Math.max(w, h);
                            w = Math.round(w * sc); h = Math.round(h * sc);
                        }
                        c.width = w; c.height = h;
                        c.getContext('2d').drawImage(img, 0, 0, w, h);
                        const data = c.getContext('2d').getImageData(0, 0, w, h);
                        const r = jsQR(data.data, data.width, data.height, { inversionAttempts: 'attemptBoth' });
                        if (!r || !r.data) reject(new Error('No QR in image'));
                        else resolve(r.data);
                    };
                    img.onerror = () => reject(new Error('Bad image'));
                    img.src = fr.result;
                };
                fr.onerror = () => reject(new Error('Read failed'));
                fr.readAsDataURL(file);
            });
        }

        document.getElementById('qrFile').onchange = async (e) => {
            const f = e.target.files && e.target.files[0];
            if (!f) return;
            showWait();
            try {
                const code = extractCode(await decodeQr(f));
                if (!code) throw new Error('No tracking code in QR');
                await loadBox(code);
            } catch (err) {
                hideWait();
                document.getElementById('boxMsg').style.color = '#D40511';
                document.getElementById('boxMsg').textContent = err.message || 'QR failed';
            }
            e.target.value = '';
        };

        document.getElementById('boxLoadBtn').onclick = () => loadBox(document.getElementById('boxCode').value);
        document.getElementById('boxCode').onkeydown = (e) => {
            if (e.key === 'Enter') loadBox(document.getElementById('boxCode').value);
        };
        document.getElementById('boxPrintBtn').onclick = () => window.print();

        const q = new URLSearchParams(location.search).get('code');
        if (q) {
            document.getElementById('boxCode').value = q;
            loadBox(q);
        }
    </script>
</body>

</html>
