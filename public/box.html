<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHL Box</title>
    <link rel="icon" href="https://commons.wikimedia.org/wiki/Special:FilePath/DHL_Express.svg">
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            background: #e8e8e8;
            font-family: Arial, sans-serif
        }

        .bar {
            background: #FFCC00;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #D40511
        }

        .bar b {
            color: #D40511;
            font-size: 22px
        }

        .bar a {
            color: #111;
            font-weight: 600;
            text-decoration: none;
            font-size: 14px
        }

        .wrap {
            max-width: 560px;
            margin: 0 auto;
            padding: 14px
        }

        .pick {
            background: #fff;
            border: 1px dashed #bbb;
            padding: 14px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 13px;
            color: #555
        }

        .msg {
            font-size: 13px;
            margin: 8px 0;
            min-height: 18px
        }

        .msg.err {
            color: #D40511;
            font-weight: 600
        }

        .msg.ok {
            color: #1F9D55
        }

        .wait {
            display: none;
            text-align: center;
            padding: 14px;
            background: #fff;
            border-radius: 6px;
            margin-bottom: 8px
        }

        .wait.on {
            display: block
        }

        #stage {
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0, 0, 0, .15)
        }

        #stage video {
            width: 100%;
            display: block;
            max-height: 75vh;
            background: #000
        }
    </style>
</head>

<body>
    <div class="bar"><b>DHL</b><a href="/" id="boxBack">Back</a></div>
    <div class="wrap">
        <div class="pick" id="boxPick">
            Receipt QR only
            <input type="file" id="file" accept="image/*" style="display:block;margin:10px auto 0;">
        </div>
        <div class="wait" id="wait"><b id="dots">......</b>
            <div data-i18n-box="Please wait">Please wait</div>
        </div>
        <p class="msg" id="msg"></p>
        <div id="stage"></div>
    </div>
    <script>
        /* Language follows index dropdown (localStorage dhl_lang) */
        (function () {
            var BOX = {
                en: { Back: 'Back', 'Receipt QR only': 'Receipt QR only', 'Please wait': 'Please wait' },
                id: { Back: 'Kembali', 'Receipt QR only': 'Hanya QR tanda terima', 'Please wait': 'Mohon tunggu' },
                ms: { Back: 'Kembali', 'Receipt QR only': 'QR resit sahaja', 'Please wait': 'Sila tunggu' },
                es: { Back: 'Volver', 'Receipt QR only': 'Solo QR del recibo', 'Please wait': 'Por favor espere' },
                mx: { Back: 'Volver', 'Receipt QR only': 'Solo QR del recibo', 'Please wait': 'Por favor espere' },
                fr: { Back: 'Retour', 'Receipt QR only': 'QR du reçu uniquement', 'Please wait': 'Veuillez patienter' },
                de: { Back: 'Zurück', 'Receipt QR only': 'Nur Beleg-QR', 'Please wait': 'Bitte warten' },
                zh: { Back: '返回', 'Receipt QR only': '仅收据二维码', 'Please wait': '请稍候' }
            };
            try {
                var L = localStorage.getItem('dhl_lang') || 'en';
                var m = BOX[L] || BOX.en;
                document.documentElement.lang = L === 'mx' ? 'es' : L;
                var back = document.getElementById('boxBack');
                if (back) back.textContent = m.Back || 'Back';
                var pick = document.getElementById('boxPick');
                if (pick) {
                    var txt = pick.firstChild;
                    if (txt && txt.nodeType === 3) txt.textContent = (m['Receipt QR only'] || 'Receipt QR only') + '\n    ';
                }
                document.querySelectorAll('[data-i18n-box]').forEach(function (el) {
                    var k = el.getAttribute('data-i18n-box');
                    if (m[k]) el.textContent = m[k];
                });
            } catch (e) { }
        })();
    </script>
    <script>
        const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
            ? 'http://localhost:5000/api' : 'https://my-delivery-w6xz.onrender.com/api';

        /** Default prompt video (replace with your file): public/videos/box-prompt.mp4
         *  Package video after correct QR: public/videos/package.mp4
         *  Optional per tracking code (never mixed): public/videos/DHL20089.mp4
         */
        const PROMPT_VIDEO = '/videos/box-prompt.mp4';
        const PACKAGE_VIDEO = '/videos/package.mp4';

        const ERR_QR = 'Please input correct QRCODE to access this server.';
        const ERR_OFF = 'Server unavailable for now. Try again or refresh the site.';

        function extract(raw) {
            const t = String(raw || '').trim();
            try { const c = new URL(t).searchParams.get('code'); if (c) return c.trim().toUpperCase(); } catch (e) { }
            const m = t.match(/DHL[A-Za-z0-9]+/i); if (m) return m[0].toUpperCase();
            if (/^[A-Za-z0-9\-_]{5,40}$/.test(t)) return t.toUpperCase();
            return '';
        }

        let timer = null;
        function showWait() { document.getElementById('wait').classList.add('on'); let n = 0; clearInterval(timer); timer = setInterval(() => { n = n % 6 + 1; document.getElementById('dots').textContent = '.'.repeat(n); }, 280); }
        function hideWait() { document.getElementById('wait').classList.remove('on'); clearInterval(timer); }

        function playVideo(src, loop) {
            const stage = document.getElementById('stage');
            stage.innerHTML = '';
            const v = document.createElement('video');
            v.controls = true;
            v.playsInline = true;
            v.autoplay = true;
            v.muted = true;
            if (loop) v.loop = true;
            v.src = src;
            v.onerror = function () {
                // fallback text-only if prompt video missing
                if (src === PROMPT_VIDEO) {
                    stage.innerHTML = '<div style="min-height:240px;display:flex;align-items:center;justify-content:center;padding:24px;background:#111;color:#fff;text-align:center;font-size:15px;line-height:1.5;">Please input the receipt to scan so you can see your package</div>';
                }
            };
            stage.appendChild(v);
            v.play().catch(function () { });
        }

        function showPrompt() {
            playVideo(PROMPT_VIDEO, true);
        }

        function showPackageVideo(code) {
            // Unique per tracking code first — never mix different shipments
            const specific = '/videos/' + encodeURIComponent(code) + '.mp4';
            const stage = document.getElementById('stage');
            stage.innerHTML = '';
            const v = document.createElement('video');
            v.controls = true;
            v.playsInline = true;
            v.autoplay = true;
            v.muted = true;
            v.src = specific;
            v.onerror = function () {
                v.onerror = null;
                v.src = PACKAGE_VIDEO;
                v.play().catch(function () { });
            };
            stage.appendChild(v);
            v.play().catch(function () { });
        }

        async function isBoxServiceOn() {
            try {
                const res = await fetch(API + '/shipments/box-service');
                const data = await res.json().catch(() => ({}));
                return data.on !== false;
            } catch (e) {
                return true;
            }
        }

        async function openWithCode(code) {
            const msg = document.getElementById('msg');
            code = String(code || '').trim().toUpperCase();
            if (!code) {
                msg.className = 'msg err';
                msg.textContent = ERR_QR;
                showPrompt();
                return;
            }
            showWait();
            msg.className = 'msg';
            msg.textContent = 'Please wait…';
            try {
                const on = await isBoxServiceOn();
                if (!on) {
                    throw Object.assign(new Error(ERR_OFF), { off: true });
                }
                const res = await fetch(API + '/shipments/track/' + encodeURIComponent(code));
                const s = await res.json().catch(() => ({}));
                if (!res.ok) {
                    throw new Error(ERR_QR);
                }
                // Only this code's video — bound to admin shipment
                showPackageVideo(s.code || code);
                msg.className = 'msg';
                msg.textContent = '';
            } catch (e) {
                msg.className = 'msg err';
                msg.textContent = e.message || ERR_QR;
                showPrompt();
            } finally {
                hideWait();
            }
        }

        document.getElementById('file').onchange = async e => {
            const f = e.target.files && e.target.files[0];
            if (!f) return;
            showWait();
            const msg = document.getElementById('msg');
            msg.className = 'msg';
            msg.textContent = 'Reading QR…';
            try {
                if (typeof jsQR !== 'function') throw new Error(ERR_QR);
                const data = await new Promise((res, rej) => {
                    const fr = new FileReader();
                    fr.onload = () => {
                        const im = new Image();
                        im.onload = () => {
                            const c = document.createElement('canvas');
                            let w = im.width, h = im.height, max = 1400;
                            if (Math.max(w, h) > max) { const sc = max / Math.max(w, h); w = Math.round(w * sc); h = Math.round(h * sc); }
                            c.width = w; c.height = h;
                            c.getContext('2d').drawImage(im, 0, 0, w, h);
                            const id = c.getContext('2d').getImageData(0, 0, w, h);
                            const r = jsQR(id.data, id.width, id.height, { inversionAttempts: 'attemptBoth' });
                            if (!r || !r.data) rej(new Error(ERR_QR));
                            else res(r.data);
                        };
                        im.onerror = () => rej(new Error(ERR_QR));
                        im.src = fr.result;
                    };
                    fr.onerror = () => rej(new Error(ERR_QR));
                    fr.readAsDataURL(f);
                });
                const code = extract(data);
                if (!code) throw new Error(ERR_QR);
                await openWithCode(code);
            } catch (err) {
                hideWait();
                msg.className = 'msg err';
                msg.textContent = err.message || ERR_QR;
                showPrompt();
            }
            e.target.value = '';
        };

        showPrompt();
    </script>
</body>

</html>
