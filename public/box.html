<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHL Shipping Box</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            background: #f0f0f0;
        }

        .topbar {
            background: #FFCC00;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 3px solid #D40511;
        }

        .topbar .logo {
            font-weight: 900;
            font-size: 28px;
            color: #D40511;
            letter-spacing: -1px;
        }

        .topbar a {
            color: #111;
            font-weight: 600;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="topbar no-print">
        <div class="logo">DHL</div>
        <a href="/">← Back to track</a>
    </div>

    <div class="box-page-wrap">
        <div class="box-toolbar no-print">
            <input id="boxCode" class="mono" placeholder="Enter tracking code" autocomplete="off">
            <button type="button" class="btn btn-red" id="boxLoadBtn">Show box</button>
            <button type="button" class="btn btn-outline" id="boxPrintBtn" disabled
                style="color:#111;border-color:#111;">Print package</button>
        </div>
        <p class="msg no-print" id="boxMsg" style="font-size:14px;color:#666;margin-bottom:12px;">Enter a valid tracking
            code (or open a QR link) to show the shipping box with receiver details from admin.</p>
        <div id="boxOut"></div>
    </div>

    <script>
        const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
            ? 'http://localhost:5000/api'
            : 'https://my-delivery-w6xz.onrender.com/api';

        function esc(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function qrUrl(code) {
            const target = location.origin + '/box.html?code=' + encodeURIComponent(code);
            return 'https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=' + encodeURIComponent(target);
        }
        function splitName(full) {
            const p = String(full || '').trim().split(/\s+/);
            if (p.length <= 1) return { first: p[0] || '—', last: '' };
            return { first: p.slice(0, -1).join(' '), last: p[p.length - 1] };
        }
        function parseAddr(addr) {
            const a = String(addr || '');
            // best-effort: "street, city, country"
            const parts = a.split(',').map(x => x.trim()).filter(Boolean);
            return {
                city: parts.length >= 2 ? parts[parts.length - 2] : (parts[0] || '—'),
                country: parts.length >= 1 ? parts[parts.length - 1] : '—',
                quarter: parts.length >= 3 ? parts.slice(0, -2).join(', ') : '—',
                raw: a || '—',
            };
        }

        async function loadBox(code) {
            const msg = document.getElementById('boxMsg');
            const out = document.getElementById('boxOut');
            const printBtn = document.getElementById('boxPrintBtn');
            printBtn.disabled = true;
            out.innerHTML = '';
            code = String(code || '').trim();
            if (!code) {
                msg.style.color = '#D40511';
                msg.textContent = 'Enter a tracking code first.';
                return;
            }
            msg.style.color = '#666';
            msg.textContent = 'Loading package……';
            try {
                const res = await fetch(API + '/shipments/track/' + encodeURIComponent(code));
                const s = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(s.error || 'Invalid tracking code');
                const r = s.receiver || {};
                const name = splitName(r.name);
                const addr = parseAddr(r.address);
                const country = addr.country;
                const city = addr.city;
                out.innerHTML = `
          <div class="dhl-ship-box" id="printBox">
            <div class="side-brand">DHL EXPRESS</div>
            <div class="box-inner">
              <div class="box-logo">DHL</div>
              <div class="dhl-label">
                <table>
                  <tr><th colspan="2">INFORMATIONS DESTINATAIRE · RECEIVER</th></tr>
                  <tr><td>Nom / Last name</td><td><b>${esc(name.last || name.first)}</b></td></tr>
                  <tr><td>Prénom / First name</td><td><b>${esc(name.first)}</b></td></tr>
                  <tr><td>Pays / Country</td><td>${esc(country)}</td></tr>
                  <tr><td>Ville / City</td><td>${esc(city)}</td></tr>
                  <tr><td>Adresse / Address</td><td>${esc(addr.raw)}</td></tr>
                  <tr><td>Téléphone / Phone</td><td>${esc(r.phone || '—')}</td></tr>
                  <tr><td>Email</td><td>${esc(r.email || '—')}</td></tr>
                  <tr><td>Tracking</td><td class="mono"><b>${esc(s.code)}</b></td></tr>
                  <tr><td colspan="2" class="qr-cell">
                    <img src="${qrUrl(s.code)}" alt="QR ${esc(s.code)}">
                    <div style="font-size:11px;color:#666;margin-top:6px;">Scan QR · same package</div>
                  </td></tr>
                </table>
              </div>
            </div>
          </div>`;
                printBtn.disabled = false;
                msg.style.color = '#1F9D55';
                msg.textContent = 'Package unlocked. You can print the box label.';
                history.replaceState(null, '', '/box.html?code=' + encodeURIComponent(s.code));
            } catch (e) {
                msg.style.color = '#D40511';
                msg.textContent = e.message || 'Could not load package.';
            }
        }

        document.getElementById('boxLoadBtn').onclick = () => loadBox(document.getElementById('boxCode').value);
        document.getElementById('boxCode').addEventListener('keydown', e => { if (e.key === 'Enter') loadBox(document.getElementById('boxCode').value); });
        document.getElementById('boxPrintBtn').onclick = () => window.print();

        const q = new URLSearchParams(location.search).get('code');
        if (q) {
            document.getElementById('boxCode').value = q;
            loadBox(q);
        }
    </script>
</body>

</html>
