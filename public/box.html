<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHL Box</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            background: #eee;
            font-family: Arial, sans-serif;
            color: #111
        }

        .bar {
            background: #FFCC00;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #D40511
        }

        .bar b {
            color: #D40511;
            font-size: 22px
        }

        .bar a {
            color: #111;
            font-weight: 600;
            text-decoration: none;
            font-size: 14px
        }

        .wrap {
            max-width: 520px;
            margin: 0 auto;
            padding: 12px
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px
        }

        input[type=text] {
            flex: 1;
            min-width: 110px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px
        }

        button {
            padding: 10px 14px;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
            border: none
        }

        .red {
            background: #D40511;
            color: #fff
        }

        .out {
            background: #fff;
            border: 1px solid #333
        }

        button:disabled {
            opacity: .4
        }

        .pick {
            background: #fff;
            border: 1px dashed #aaa;
            padding: 10px;
            text-align: center;
            font-size: 12px;
            margin-bottom: 10px;
            border-radius: 6px
        }

        .msg {
            font-size: 13px;
            margin: 8px 0;
            color: #555
        }

        .wait {
            display: none;
            text-align: center;
            padding: 14px;
            background: #fff;
            margin-bottom: 8px
        }

        .wait.on {
            display: block
        }

        .photo-only {
            width: 100%;
            display: block;
            border-radius: 4px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .18)
        }

        .details {
            margin-top: 14px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
        }

        .details h3 {
            background: #FFCC00;
            color: #111;
            padding: 10px 12px;
            font-size: 14px;
            margin: 0;
        }

        .details table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px
        }

        .details td {
            padding: 10px 12px;
            border-bottom: 1px solid #eee
        }

        .details tr:last-child td {
            border-bottom: none
        }

        .details td.k {
            width: 40%;
            color: #555;
            font-weight: 600;
            background: #fafafa
        }

        .details td.v {
            font-weight: 700
        }

        @media print {

            .bar,
            .row,
            .pick,
            .msg,
            .wait {
                display: none !important
            }

            body {
                background: #fff
            }
        }
    </style>
</head>

<body>
    <div class="bar"><b>DHL</b><a href="/">Back</a></div>
    <div class="wrap">
        <div class="row">
            <input type="text" id="code" placeholder="Tracking code">
            <button class="red" type="button" id="go">Show box</button>
            <button class="out" type="button" id="printBtn" disabled>Print</button>
        </div>
        <div class="pick">QR from gallery<br><input type="file" id="file" accept="image/*" style="margin-top:8px"></div>
        <div class="wait" id="wait"><b id="dots">......</b>
            <div>Please wait</div>
        </div>
        <p class="msg" id="msg"></p>
        <div id="out"></div>
    </div>
    <script>
        const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
            ? 'http://localhost:5000/api' : 'https://my-delivery-w6xz.onrender.com/api';
        const PHOTO = '/images/dhl-box-photo.jpg';

        function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
        function splitName(n) {
            const p = String(n || '').trim().split(/\s+/).filter(Boolean);
            if (!p.length) return { f: '—', l: '—' };
            if (p.length === 1) return { f: p[0], l: '—' };
            return { f: p.slice(0, -1).join(' '), l: p[p.length - 1] };
        }
        function parseAddr(a) {
            const p = String(a || '').split(',').map(x => x.trim()).filter(Boolean);
            if (!p.length) return { c: '—', city: '—', d: '—' };
            if (p.length === 1) return { c: p[0], city: '—', d: '—' };
            if (p.length === 2) return { c: p[1], city: p[0], d: '—' };
            return { c: p[p.length - 1], city: p[p.length - 2], d: p.slice(0, -2).join(', ') };
        }
        function extract(raw) {
            const t = String(raw || '').trim();
            try { const c = new URL(t).searchParams.get('code'); if (c) return c.trim(); } catch (e) { }
            const m = t.match(/DHL[A-Za-z0-9]+/i); if (m) return m[0];
            if (/^[A-Za-z0-9\-_]{5,32}$/.test(t)) return t;
            return '';
        }

        /** Photo only — no drawing on the image. Details below (like receipt). */
        function render(s) {
            const r = s.receiver || {};
            const nm = splitName(r.name);
            const ad = parseAddr(r.address);
            return `
  <img class="photo-only" src="${PHOTO}?v=${Date.now()}" alt="DHL package box">
  <div class="details">
    <h3>Receiver details (from admin)</h3>
    <table>
      <tr><td class="k">Last name</td><td class="v">${esc(nm.l)}</td></tr>
      <tr><td class="k">First name</td><td class="v">${esc(nm.f)}</td></tr>
      <tr><td class="k">Country</td><td class="v">${esc(ad.c)}</td></tr>
      <tr><td class="k">City</td><td class="v">${esc(ad.city)}</td></tr>
      <tr><td class="k">District</td><td class="v">${esc(ad.d)}</td></tr>
      <tr><td class="k">Phone</td><td class="v">${esc(r.phone || '—')}</td></tr>
      <tr><td class="k">Tracking</td><td class="v">${esc(s.code)}</td></tr>
    </table>
  </div>`;
        }

        let timer = null;
        function showWait() { document.getElementById('wait').classList.add('on'); let n = 0; clearInterval(timer); timer = setInterval(() => { n = n % 6 + 1; document.getElementById('dots').textContent = '.'.repeat(n); }, 280); }
        function hideWait() { document.getElementById('wait').classList.remove('on'); clearInterval(timer); }

        async function load(code) {
            const msg = document.getElementById('msg'), out = document.getElementById('out'), pb = document.getElementById('printBtn');
            pb.disabled = true; out.innerHTML = '';
            code = String(code || '').trim();
            if (!code) { msg.style.color = '#D40511'; msg.textContent = 'Enter code or upload QR.'; return; }
            showWait(); msg.style.color = '#555'; msg.textContent = 'Please wait…';
            try {
                const res = await fetch(API + '/shipments/track/' + encodeURIComponent(code));
                const s = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(s.error || 'Invalid code');
                out.innerHTML = render(s);
                pb.disabled = false;
                document.getElementById('code').value = s.code;
                msg.style.color = '#1F9D55';
                msg.textContent = 'Package ready. Photo is clean — details are listed below.';
            } catch (e) { msg.style.color = '#D40511'; msg.textContent = e.message || 'Failed'; }
            finally { hideWait(); }
        }

        document.getElementById('go').onclick = () => load(document.getElementById('code').value);
        document.getElementById('code').onkeydown = e => { if (e.key === 'Enter') load(document.getElementById('code').value); };
        document.getElementById('printBtn').onclick = () => window.print();
        document.getElementById('file').onchange = async e => {
            const f = e.target.files && e.target.files[0]; if (!f) return;
            showWait();
            try {
                if (typeof jsQR !== 'function') throw new Error('QR reader not loaded');
                const data = await new Promise((res, rej) => {
                    const fr = new FileReader();
                    fr.onload = () => {
                        const im = new Image();
                        im.onload = () => {
                            const c = document.createElement('canvas'); let w = im.width, h = im.height, max = 1400;
                            if (Math.max(w, h) > max) { const sc = max / Math.max(w, h); w = Math.round(w * sc); h = Math.round(h * sc); }
                            c.width = w; c.height = h; c.getContext('2d').drawImage(im, 0, 0, w, h);
                            const id = c.getContext('2d').getImageData(0, 0, w, h);
                            const r = jsQR(id.data, id.width, id.height, { inversionAttempts: 'attemptBoth' });
                            if (!r || !r.data) rej(new Error('No QR found')); else res(r.data);
                        };
                        im.onerror = () => rej(new Error('Bad image')); im.src = fr.result;
                    };
                    fr.onerror = () => rej(new Error('Read failed')); fr.readAsDataURL(f);
                });
                const code = extract(data); if (!code) throw new Error('No tracking code in QR'); await load(code);
            } catch (err) { hideWait(); document.getElementById('msg').style.color = '#D40511'; document.getElementById('msg').textContent = err.message || 'QR failed'; }
            e.target.value = '';
        };
        const q = new URLSearchParams(location.search).get('code');
        if (q) { document.getElementById('code').value = q; load(q); }
    </script>
</body>

</html>
