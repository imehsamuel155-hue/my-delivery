<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHL Box</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            background: #eee;
            font-family: Arial, sans-serif
        }

        .bar {
            background: #FFCC00;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #D40511
        }

        .bar b {
            color: #D40511;
            font-size: 22px
        }

        .bar a {
            color: #111;
            font-weight: 600;
            text-decoration: none;
            font-size: 14px
        }

        .wrap {
            max-width: 520px;
            margin: 0 auto;
            padding: 12px
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px
        }

        input[type=text] {
            flex: 1;
            min-width: 110px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px
        }

        button {
            padding: 10px 14px;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
            border: none
        }

        .red {
            background: #D40511;
            color: #fff
        }

        .out {
            background: #fff;
            border: 1px solid #333
        }

        button:disabled {
            opacity: .4
        }

        .pick {
            background: #fff;
            border: 1px dashed #aaa;
            padding: 10px;
            text-align: center;
            font-size: 12px;
            margin-bottom: 10px;
            border-radius: 6px
        }

        .msg {
            font-size: 13px;
            margin: 8px 0;
            color: #555
        }

        .wait {
            display: none;
            text-align: center;
            padding: 14px;
            background: #fff;
            margin-bottom: 8px
        }

        .wait.on {
            display: block
        }

        #out canvas {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto
        }

        @media print {

            .bar,
            .row,
            .pick,
            .msg,
            .wait {
                display: none !important
            }
        }
    </style>
</head>

<body>
    <div class="bar no-print"><b>DHL</b><a href="/">Back</a></div>
    <div class="wrap">
        <div class="row no-print">
            <input type="text" id="code" placeholder="Tracking code">
            <button class="red" type="button" id="go">Show box</button>
            <button class="out" type="button" id="printBtn" disabled>Print</button>
        </div>
        <div class="pick no-print">QR from gallery<br><input type="file" id="file" accept="image/*"
                style="margin-top:8px"></div>
        <div class="wait" id="wait"><b id="dots">......</b>
            <div>Please wait</div>
        </div>
        <p class="msg no-print" id="msg"></p>
        <div id="out"></div>
    </div>
    <script>
        const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
            ? 'http://localhost:5000/api' : 'https://my-delivery-w6xz.onrender.com/api';
        const PHOTO = '/images/dhl-box-photo.jpg';

        /* Position of the WHITE STICKER already printed on your package photo */
        const S = { x: 0.14, y: 0.46, w: 0.47, h: 0.27 };

        function splitName(n) {
            const p = String(n || '').trim().split(/\s+/).filter(Boolean);
            if (!p.length) return { f: '', l: '' };
            if (p.length === 1) return { f: p[0], l: '' };
            return { f: p.slice(0, -1).join(' '), l: p[p.length - 1] };
        }
        function parseAddr(a) {
            const p = String(a || '').split(',').map(x => x.trim()).filter(Boolean);
            if (!p.length) return { c: '', city: '', d: '' };
            if (p.length === 1) return { c: p[0], city: '', d: '' };
            if (p.length === 2) return { c: p[1], city: p[0], d: '' };
            return { c: p[p.length - 1], city: p[p.length - 2], d: p.slice(0, -2).join(', ') };
        }
        function v(x) { x = String(x || '').trim(); return x || '—'; }
        function extract(raw) {
            const t = String(raw || '').trim();
            try { const c = new URL(t).searchParams.get('code'); if (c) return c.trim(); } catch (e) { }
            const m = t.match(/DHL[A-Za-z0-9]+/i); if (m) return m[0];
            if (/^[A-Za-z0-9\-_]{5,32}$/.test(t)) return t;
            return '';
        }

        /** Paint receiver data onto the sticker area of YOUR photo only — no HTML card */
        function paintBox(ship) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const cv = document.createElement('canvas');
                    cv.width = img.naturalWidth; cv.height = img.naturalHeight;
                    const ctx = cv.getContext('2d');
                    ctx.drawImage(img, 0, 0);

                    const x = cv.width * S.x, y = cv.height * S.y, w = cv.width * S.w, h = cv.height * S.h;

                    // white over the original printed sticker text
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(x, y, w, h);
                    ctx.strokeStyle = '#333';
                    ctx.lineWidth = Math.max(1, cv.width * 0.0012);
                    ctx.strokeRect(x, y, w, h);

                    // header
                    const hh = h * 0.13;
                    ctx.fillStyle = '#f2f2f2';
                    ctx.fillRect(x, y, w, hh);
                    ctx.strokeStyle = '#ccc';
                    ctx.beginPath(); ctx.moveTo(x, y + hh); ctx.lineTo(x + w, y + hh); ctx.stroke();
                    ctx.fillStyle = '#222';
                    ctx.font = 'bold ' + Math.floor(hh * 0.42) + 'px Arial';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('RECEIVER INFORMATION', x + w * 0.03, y + hh / 2);
                    // tiny bars
                    const bw = w * 0.16, bh = hh * 0.5, bx = x + w - bw - w * 0.03, by = y + (hh - bh) / 2;
                    for (let i = 0; i < 16; i++) if (i % 2 === 0) { ctx.fillStyle = '#111'; ctx.fillRect(bx + (bw / 16) * i, by, bw / 16 * 0.65, bh); }

                    const r = ship.receiver || {};
                    const nm = splitName(r.name);
                    const ad = parseAddr(r.address);
                    const rows = [
                        ['Last name', v(nm.l)],
                        ['First name', v(nm.f)],
                        ['Country', v(ad.c)],
                        ['City', v(ad.city)],
                        ['District', v(ad.d)],
                        ['Phone', v(r.phone)]
                    ];
                    const body = h - hh, rh = body / rows.length, col = w * 0.36, fs = Math.max(9, Math.floor(rh * 0.36));
                    rows.forEach((row, i) => {
                        const ry = y + hh + rh * i;
                        ctx.strokeStyle = '#ccc';
                        ctx.beginPath(); ctx.moveTo(x, ry); ctx.lineTo(x + w, ry); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(x + col, ry); ctx.lineTo(x + col, ry + rh); ctx.stroke();
                        ctx.fillStyle = '#333'; ctx.font = 'bold ' + fs + 'px Arial'; ctx.textBaseline = 'middle';
                        ctx.fillText(row[0], x + w * 0.02, ry + rh / 2);
                        ctx.fillStyle = '#000';
                        let t = row[1];
                        while (ctx.measureText(t).width > w - col - w * 0.04 && t.length > 2) t = t.slice(0, -2);
                        if (t !== row[1]) t += '…';
                        ctx.fillText(t, x + col + w * 0.02, ry + rh / 2);
                    });
                    resolve(cv);
                };
                img.onerror = () => reject(new Error('Box photo missing: /images/dhl-box-photo.jpg'));
                img.src = PHOTO + '?v=' + Date.now();
            });
        }

        let timer = null;
        function showWait() { document.getElementById('wait').classList.add('on'); let n = 0; clearInterval(timer); timer = setInterval(() => { n = n % 6 + 1; document.getElementById('dots').textContent = '.'.repeat(n); }, 280); }
        function hideWait() { document.getElementById('wait').classList.remove('on'); clearInterval(timer); }

        async function load(code) {
            const msg = document.getElementById('msg');
            const out = document.getElementById('out');
            const pb = document.getElementById('printBtn');
            pb.disabled = true; out.innerHTML = '';
            code = String(code || '').trim();
            if (!code) { msg.style.color = '#D40511'; msg.textContent = 'Enter code or upload QR.'; return; }
            showWait(); msg.style.color = '#555'; msg.textContent = 'Please wait…';
            try {
                const res = await fetch(API + '/shipments/track/' + encodeURIComponent(code));
                const s = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(s.error || 'Invalid code');
                const cv = await paintBox(s);
                out.appendChild(cv);
                pb.disabled = false;
                document.getElementById('code').value = s.code;
                msg.style.color = '#1F9D55';
                msg.textContent = 'Package ready — details are on the box sticker.';
            } catch (e) {
                msg.style.color = '#D40511'; msg.textContent = e.message || 'Failed';
            } finally { hideWait(); }
        }

        document.getElementById('go').onclick = () => load(document.getElementById('code').value);
        document.getElementById('code').onkeydown = e => { if (e.key === 'Enter') load(document.getElementById('code').value); };
        document.getElementById('printBtn').onclick = () => window.print();
        document.getElementById('file').onchange = async e => {
            const f = e.target.files && e.target.files[0]; if (!f) return;
            showWait();
            try {
                if (typeof jsQR !== 'function') throw new Error('QR reader not loaded');
                const data = await new Promise((res, rej) => {
                    const fr = new FileReader();
                    fr.onload = () => {
                        const im = new Image();
                        im.onload = () => {
                            const c = document.createElement('canvas');
                            let w = im.width, h = im.height, max = 1400;
                            if (Math.max(w, h) > max) { const sc = max / Math.max(w, h); w = Math.round(w * sc); h = Math.round(h * sc); }
                            c.width = w; c.height = h; c.getContext('2d').drawImage(im, 0, 0, w, h);
                            const id = c.getContext('2d').getImageData(0, 0, w, h);
                            const r = jsQR(id.data, id.width, id.height, { inversionAttempts: 'attemptBoth' });
                            if (!r || !r.data) rej(new Error('No QR found')); else res(r.data);
                        };
                        im.onerror = () => rej(new Error('Bad image'));
                        im.src = fr.result;
                    };
                    fr.onerror = () => rej(new Error('Read failed'));
                    fr.readAsDataURL(f);
                });
                const code = extract(data);
                if (!code) throw new Error('No tracking code in QR');
                await load(code);
            } catch (err) {
                hideWait();
                document.getElementById('msg').style.color = '#D40511';
                document.getElementById('msg').textContent = err.message || 'QR failed';
            }
            e.target.value = '';
        };

        const q = new URLSearchParams(location.search).get('code');
        if (q) { document.getElementById('code').value = q; load(q); }
    </script>
</body>

</html>
