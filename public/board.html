<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Office Board</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: #e8eaed;
            color: #0f172a
        }

        .bar {
            background: #1e293b;
            color: #e2e8f0;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 20
        }

        .bar strong {
            color: #93c5fd
        }

        .bar a {
            color: #93c5fd;
            text-decoration: none
        }

        .wrap {
            max-width: 960px;
            margin: 0 auto;
            padding: 14px 12px 40px
        }

        h1 {
            font-size: 1.35rem;
            margin: 0 0 6px
        }

        .sub {
            color: #64748b;
            font-size: 13px;
            margin: 0 0 14px
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 14px
        }

        .actions button,
        .actions a.btn {
            display: block;
            width: 100%;
            padding: 14px 10px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            background: #fff;
            color: #0f172a;
            font-weight: 600;
            font-size: 14px;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent
        }

        .actions button.red {
            background: #D40511;
            color: #fff;
            border: none;
            grid-column: 1/-1
        }

        .panel {
            background: #fff;
            border-radius: 12px;
            padding: 14px;
            border: 1px solid #e2e8f0;
            margin-bottom: 12px
        }

        .panel h2 {
            font-size: 14px;
            margin: 0 0 10px;
            text-transform: uppercase;
            letter-spacing: .04em;
            color: #64748b
        }

        .ship {
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            background: #fafafa
        }

        .ship:active,
        .ship.on {
            background: #eff6ff;
            border-color: #93c5fd
        }

        .ship .code {
            font-weight: 700
        }

        .ship .meta {
            font-size: 13px;
            color: #64748b;
            margin-top: 2px
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin: 10px 0 4px
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px
        }

        .row2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px
        }

        @media(max-width:500px) {
            .row2 {
                grid-template-columns: 1fr
            }
        }

        .form-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px
        }

        .form-actions button {
            flex: 1;
            min-width: 120px;
            padding: 12px;
            border-radius: 8px;
            border: 0;
            font-weight: 700;
            cursor: pointer
        }

        .form-actions .save {
            background: #D40511;
            color: #fff
        }

        .form-actions .sec {
            background: #e2e8f0;
            color: #0f172a
        }

        .msg {
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin: 8px 0;
            display: none
        }

        .msg.err {
            display: block;
            background: #fef2f2;
            color: #b91c1c
        }

        .msg.ok {
            display: block;
            background: #f0fdf4;
            color: #15803d
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, .55);
            z-index: 50;
            padding: 16px;
            align-items: flex-end;
            justify-content: center;
            overflow: auto
        }

        .modal.show {
            display: flex
        }

        .modal-box {
            background: #fff;
            border-radius: 14px 14px 0 0;
            padding: 18px;
            width: 100%;
            max-width: 440px;
            max-height: 90vh;
            overflow: auto;
            margin-top: auto
        }

        @media(min-width:600px) {
            .modal {
                align-items: center
            }

            .modal-box {
                border-radius: 14px;
                margin: 0
            }
        }

        .modal-box h3 {
            margin: 0 0 8px
        }

        .hidden {
            display: none !important
        }

        #detail {
            display: none
        }

        #detail.show {
            display: block
        }
    </style>
</head>

<body>
    <div class="bar">
        <span><strong> PROJECT</strong> · Office board</span>
        <a href="/admin.html" id="logout">Log out</a>
    </div>
    <div class="wrap">
        <h1>Office Dashboard</h1>
        <p class="sub">Tap a button or a shipment.</p>

        <div class="actions">
            <a class="btn" href="/chat.html">💬 Chats</a>
            <button type="button" id="btnBox">Box video: …</button>
            <button type="button" class="red" id="btnNew">+ New Shipment</button>
            <button type="button" id="btnSettings">⚙ Account Settings</button>
        </div>

        <div id="status" class="msg"></div>

        <div class="panel">
            <h2>All Shipments</h2>
            <div id="list">Loading…</div>
        </div>

        <div class="panel hidden" id="detail">
            <h2 id="detailTitle">Shipment</h2>
            <div id="detailBody"></div>
        </div>
    </div>

    <!-- Settings PIN -->
    <div class="modal" id="modalPin">
        <div class="modal-box">
            <h3>Settings PIN</h3>
            <p class="sub">Enter <strong></strong></p>
            <input id="settingsPin" type="password" inputmode="numeric" maxlength="8" placeholder="7799">
            <div class="form-actions">
                <button type="button" class="save" id="pinOk">Open</button>
                <button type="button" class="sec" id="pinCancel">Cancel</button>
            </div>
            <div id="pinErr" class="msg"></div>
        </div>
    </div>

    <!-- Account settings -->
    <div class="modal" id="modalSettings">
        <div class="modal-box">
            <h3>Account settings</h3>
            <label>New username</label>
            <input id="newUser" placeholder="Optional">
            <label>New password</label>
            <input id="newPass" type="password" placeholder="Optional">
            <label>New login PIN (4–8 digits)</label>
            <input id="newLoginPin" type="password" inputmode="numeric" maxlength="8">
            <label>New chat PIN (4–8 digits)</label>
            <input id="newChatPin" type="password" inputmode="numeric" maxlength="8" placeholder="4422">
            <label>Current password (required)</label>
            <input id="curPass" type="password">
            <div class="form-actions">
                <button type="button" class="save" id="saveSettings">Save</button>
                <button type="button" class="sec" id="closeSettings">Close</button>
            </div>
            <div id="setMsg" class="msg"></div>
        </div>
    </div>

    <script>
        (function () {
            var API = 'https://my-delivery-w6xz.onrender.com/api';
            var token = sessionStorage.getItem('dhlAdminToken') || '';
            var shipments = [];
            var boxOn = true;

            function $(id) { return document.getElementById(id); }
            function show(el, type, text) {
                el.className = 'msg ' + (type || '');
                el.textContent = text || '';
                el.style.display = text ? 'block' : 'none';
            }
            function headers() {
                return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
            }
            async function api(path, opts) {
                opts = opts || {};
                var res = await fetch(API + path, Object.assign({}, opts, {
                    headers: Object.assign(headers(), opts.headers || {})
                }));
                var data = {};
                try { data = await res.json(); } catch (e) { }
                if (!res.ok) throw new Error(data.error || data.message || ('HTTP ' + res.status));
                return data;
            }

            if (!token) {
                $('status').className = 'msg err';
                $('status').textContent = 'Not logged in. Redirecting…';
                $('status').style.display = 'block';
                setTimeout(function () { location.href = '/admin.html'; }, 600);
                return;
            }

            $('logout').onclick = function () {
                sessionStorage.removeItem('dhlAdminToken');
            };

            async function loadList() {
                $('list').textContent = 'Loading…';
                try {
                    shipments = await api('/shipments');
                    if (!Array.isArray(shipments)) shipments = [];
                    if (!shipments.length) {
                        $('list').innerHTML = '<p class="sub">No shipments. Tap + New Shipment.</p>';
                        return;
                    }
                    $('list').innerHTML = shipments.map(function (s, i) {
                        var code = s.code || s.trackingCode || ('#' + i);
                        var from = (s.sender && s.sender.name) || s.senderName || '?';
                        var to = (s.receiver && s.receiver.name) || s.receiverName || '?';
                        var st = s.pinProtected ? '🔒 Locked' : (s.history && s.history.length ? s.history[s.history.length - 1].label : (s.status || ''));
                        return '<div class="ship" data-i="' + i + '"><div class="code">' + esc(code) + (s.pinProtected ? ' 🔒' : '') +
                            '</div><div class="meta">' + esc(from) + ' → ' + esc(to) + '</div><div class="meta">' + esc(st) + '</div></div>';
                    }).join('');
                    $('list').querySelectorAll('.ship').forEach(function (el) {
                        el.onclick = function () {
                            $('list').querySelectorAll('.ship').forEach(function (x) { x.classList.remove('on'); });
                            el.classList.add('on');
                            openShipment(shipments[+el.getAttribute('data-i')]);
                        };
                    });
                } catch (e) {
                    $('list').innerHTML = '<p class="msg err" style="display:block">' + esc(e.message) + '</p>';
                }
            }

            function esc(t) {
                return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
            }

            function openShipment(s) {
                var isNew = !s;
                var code = isNew ? '' : (s.code || '');
                var sender = (s && s.sender) || {};
                var receiver = (s && s.receiver) || {};
                var pack = (s && s.package) || {};
                var pay = (s && s.payment) || {};
                $('detailTitle').textContent = isNew ? 'New shipment' : ('Edit ' + code);
                $('detailBody').innerHTML =
                    '<label>Tracking code (empty = auto)</label><input id="f_code" value="' + esc(code) + '" ' + (isNew ? '' : 'readonly') + '>' +
                    '<label>Access PIN (4 digits, locks edit + chat)</label><input id="f_pin" inputmode="numeric" maxlength="8" placeholder="e.g. 1234" value="">' +
                    '<div class="row2"><div><label>Sender name</label><input id="f_sn" value="' + esc(sender.name || s && s.senderName || '') + '"></div>' +
                    '<div><label>Receiver name</label><input id="f_rn" value="' + esc(receiver.name || s && s.receiverName || '') + '"></div></div>' +
                    '<label>Sender address</label><input id="f_sa" value="' + esc(sender.address || '') + '">' +
                    '<label>Receiver address</label><input id="f_ra" value="' + esc(receiver.address || '') + '">' +
                    '<div class="row2"><div><label>Origin</label><input id="f_o" value="' + esc(s && (s.origin || sender.city) || '') + '"></div>' +
                    '<div><label>Destination</label><input id="f_d" value="' + esc(s && (s.destination || receiver.city) || '') + '"></div></div>' +
                    '<div class="row2"><div><label>Amount</label><input id="f_amt" type="number" step="0.01" value="' + esc(pay.amount || '') + '"></div>' +
                    '<div><label>Currency</label><input id="f_cur" value="' + esc(pay.currency || 'USD') + '"></div></div>' +
                    '<label>Status note</label><input id="f_status" value="" placeholder="e.g. In Transit">' +
                    '<div class="form-actions">' +
                    '<button type="button" class="save" id="btnSaveShip">Save</button>' +
                    '<button type="button" class="sec" id="btnCloseDetail">Close</button></div>' +
                    '<div id="shipMsg" class="msg"></div>';
                $('detail').classList.add('show');
                $('detail').classList.remove('hidden');
                $('detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
                $('btnCloseDetail').onclick = function () {
                    $('detail').classList.add('hidden');
                    $('detail').classList.remove('show');
                };
                $('btnSaveShip').onclick = function () { saveShip(isNew, code); };
            }

            async function saveShip(isNew, oldCode) {
                var msg = $('shipMsg');
                show(msg, '', '');
                var body = {
                    code: $('f_code').value.trim() || undefined,
                    accessPin: $('f_pin').value.trim() || undefined,
                    sender: { name: $('f_sn').value.trim(), address: $('f_sa').value.trim() },
                    receiver: { name: $('f_rn').value.trim(), address: $('f_ra').value.trim() },
                    origin: $('f_o').value.trim(),
                    destination: $('f_d').value.trim(),
                    payment: { amount: $('f_amt').value, currency: $('f_cur').value.trim() || 'USD' }
                };
                var st = $('f_status').value.trim();
                try {
                    if (isNew) {
                        await api('/shipments', { method: 'POST', body: JSON.stringify(body) });
                    } else {
                        await api('/shipments/' + encodeURIComponent(oldCode), { method: 'PUT', body: JSON.stringify(body) });
                        if (st) {
                            try {
                                await api('/shipments/' + encodeURIComponent(oldCode) + '/history', {
                                    method: 'POST',
                                    body: JSON.stringify({ label: st, location: body.destination || '' })
                                });
                            } catch (e2) { /* history optional */ }
                        }
                    }
                    show(msg, 'ok', 'Saved. Main site will show this after refresh.');
                    loadList();
                } catch (e) {
                    show(msg, 'err', e.message);
                }
            }

            $('btnNew').onclick = function () {
                openShipment(null);
            };

            $('btnSettings').onclick = function () {
                $('settingsPin').value = '';
                show($('pinErr'), '', '');
                $('modalPin').classList.add('show');
            };
            $('pinCancel').onclick = function () { $('modalPin').classList.remove('show'); };
            $('pinOk').onclick = function () {
                if ($('settingsPin').value.trim() !== '7799') {
                    show($('pinErr'), 'err', 'Incorrect PIN. Use 7799.');
                    return;
                }
                $('modalPin').classList.remove('show');
                show($('setMsg'), '', '');
                $('modalSettings').classList.add('show');
            };
            $('closeSettings').onclick = function () { $('modalSettings').classList.remove('show'); };
            $('saveSettings').onclick = async function () {
                show($('setMsg'), '', '');
                try {
                    var data = await api('/auth/credentials', {
                        method: 'PUT',
                        body: JSON.stringify({
                            currentPassword: $('curPass').value,
                            newUsername: $('newUser').value.trim(),
                            newPassword: $('newPass').value.trim(),
                            newPin: $('newLoginPin').value.trim(),
                            newChatPin: $('newChatPin').value.trim()
                        })
                    });
                    show($('setMsg'), 'ok', 'Saved. Username: ' + (data.username || ''));
                    $('curPass').value = '';
                    $('newUser').value = '';
                    $('newPass').value = '';
                    $('newLoginPin').value = '';
                    $('newChatPin').value = '';
                } catch (e) {
                    show($('setMsg'), 'err', e.message);
                }
            };

            async function refreshBox() {
                try {
                    var d = await api('/shipments/box-service');
                    boxOn = d.on !== false;
                    $('btnBox').textContent = boxOn ? 'Box video: ON' : 'Box video: OFF';
                    $('btnBox').style.color = boxOn ? '#15803d' : '#b91c1c';
                } catch (e) {
                    $('btnBox').textContent = 'Box video: ?';
                }
            }
            $('btnBox').onclick = async function () {
                try {
                    var d = await api('/shipments/box-service', {
                        method: 'PUT',
                        body: JSON.stringify({ on: !boxOn })
                    });
                    boxOn = d.on !== false;
                    $('btnBox').textContent = boxOn ? 'Box video: ON' : 'Box video: OFF';
                    $('btnBox').style.color = boxOn ? '#15803d' : '#b91c1c';
                    show($('status'), 'ok', 'Box video ' + (boxOn ? 'ON' : 'OFF'));
                } catch (e) {
                    show($('status'), 'err', e.message);
                }
            };

            loadList();
            refreshBox();
        })();
    </script>
</body>

</html>
