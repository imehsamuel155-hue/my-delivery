<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title> Office Board</title>
    <meta name="robots" content="noindex,nofollow">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: rgba(0, 0, 0, .08)
        }

        html,
        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: #eef1f4;
            color: #0f172a;
            overflow-x: hidden
        }

        .top {
            background: #1e293b;
            color: #e2e8f0;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50
        }

        .top b {
            color: #93c5fd
        }

        .top a {
            color: #93c5fd;
            text-decoration: none;
            font-size: 13px;
            margin-left: 10px
        }

        .page {
            max-width: 920px;
            margin: 0 auto;
            padding: 12px 10px 80px
        }

        h1 {
            font-size: 1.25rem;
            margin: 0 0 4px
        }

        .hint {
            color: #64748b;
            font-size: 13px;
            margin: 0 0 12px
        }

        .grid-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px
        }

        .grid-btns button,
        .grid-btns a {
            min-height: 48px;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            background: #fff;
            color: #0f172a;
            font-weight: 600;
            font-size: 14px;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .grid-btns .primary {
            background: #eab308;
            color: #111;
            border: none;
            grid-column: 1/-1
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 14px;
            border: 1px solid #e2e8f0;
            margin-bottom: 12px
        }

        .card h2 {
            margin: 0 0 10px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: #64748b
        }

        .item {
            padding: 14px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            margin-bottom: 8px;
            background: #fafafa;
            cursor: pointer
        }

        .item.active {
            background: #eff6ff;
            border-color: #93c5fd
        }

        .item .c {
            font-weight: 700
        }

        .item .m {
            font-size: 13px;
            color: #64748b;
            margin-top: 3px
        }

        #editor {
            display: none
        }

        #editor.show {
            display: block
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin: 12px 0 4px
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px
        }

        .two {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0
        }

        @media(min-width:640px) {
            .two {
                grid-template-columns: 1fr 1fr;
                gap: 10px
            }
        }

        #map {
            height: 260px;
            width: 100%;
            border-radius: 10px;
            background: #d1d5db;
            margin: 8px 0;
            touch-action: none
        }

        .bar-wrap {
            margin: 12px 0 6px
        }

        .bar-track {
            height: 14px;
            background: #e5e7eb;
            border-radius: 999px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            touch-action: none
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #fbbf24, #eab308);
            width: 0%;
            border-radius: 999px;
            transition: width .05s linear
        }

        .pct {
            font-size: 13px;
            color: #64748b;
            margin-top: 6px
        }

        .map-ctrls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 10px 0
        }

        .map-ctrls button {
            min-height: 44px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px
        }

        .map-ctrls .go {
            background: #eab308;
            border: none
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 8px 0
        }

        .chips button {
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            font-size: 12px;
            cursor: pointer
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px
        }

        .actions button {
            flex: 1;
            min-width: 110px;
            min-height: 48px;
            padding: 12px;
            border: 0;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer
        }

        .actions .save {
            background: #eab308;
            color: #111
        }

        .actions .del {
            background: #7f1d1d;
            color: #fff
        }

        .actions .sec {
            background: #e2e8f0
        }

        .toast {
            display: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin: 8px 0
        }

        .toast.err {
            display: block;
            background: #fef2f2;
            color: #b91c1c
        }

        .toast.ok {
            display: block;
            background: #f0fdf4;
            color: #15803d
        }

        .toast.wait {
            display: block;
            background: #f1f5f9;
            color: #334155
        }

        .timeline {
            border-left: 3px solid #22c55e;
            margin: 10px 0 10px 8px;
            padding-left: 12px
        }

        .timeline .step {
            margin-bottom: 10px;
            font-size: 13px
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, .55);
            z-index: 60;
            padding: 12px;
            align-items: flex-end;
            justify-content: center;
            overflow: auto
        }

        .modal.open {
            display: flex
        }

        .mbox {
            background: #fff;
            width: 100%;
            max-width: 420px;
            border-radius: 14px 14px 0 0;
            padding: 18px;
            max-height: 90vh;
            overflow: auto
        }

        @media(min-width:600px) {
            .modal {
                align-items: center
            }

            .mbox {
                border-radius: 14px
            }
        }

        .veh-marker {
            font-size: 28px;
            line-height: 1;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .35));
            transform-origin: center center
        }
    </style>
</head>

<body>
    <div class="top">
        <span><b></b> · Office board</span>
        <span><a href="/chat.html">Chat</a><a href="/admin.html" id="logout">Log out</a></span>
    </div>
    <div class="page">
        <h1>Office Dashboard</h1>
        <p class="hint">Full editor. Map + fill bar at the bottom. Changes sync to public track, receipt &amp; box.</p>
        <div class="grid-btns">
            <a href="/chat.html">💬 Chats</a>
            <button type="button" id="btnBox">Box: …</button>
            <button type="button" class="primary" id="btnNew">+ New Shipment</button>
            <button type="button" id="btnSettings">⚙ Account Settings</button>
        </div>
        <div id="toast" class="toast"></div>
        <div class="card">
            <h2>All shipments</h2>
            <div id="list">Loading…</div>
        </div>
        <div class="card" id="editor">
            <h2 id="edTitle">Shipment</h2>
            <div id="ed"></div>
        </div>
    </div>

    <div class="modal" id="modalPin">
        <div class="mbox">
            <h3>Settings PIN</h3>
            <p class="hint">Enter <strong></strong></p>
            <input id="pinVal" type="password" inputmode="numeric" maxlength="8">
            <div class="actions"><button type="button" class="save" id="pinOk">Open</button><button type="button"
                    class="sec" id="pinCancel">Cancel</button></div>
            <div id="pinErr" class="toast"></div>
        </div>
    </div>
    <div class="modal" id="modalSet">
        <div class="mbox">
            <h3>Account settings</h3>
            <label>New username</label><input id="sUser">
            <label>New password</label><input id="sPass" type="password">
            <label>New login PIN</label><input id="sLoginPin" type="password" inputmode="numeric" maxlength="8">
            <label>New chat PIN</label><input id="sChatPin" type="password" inputmode="numeric" maxlength="8"
                placeholder="4422">
            <label>Current password</label><input id="sCur" type="password">
            <div class="actions"><button type="button" class="save" id="sSave">Save</button><button type="button"
                    class="sec" id="sClose">Close</button></div>
            <div id="sMsg" class="toast"></div>
        </div>
    </div>

            async function api(path, opts) {
                opts = opts || {};
                var res = await fetch(API + path, Object.assign({}, opts, { headers: Object.assign(headers(), opts.headers || {}) }));
                var data = {}; try { data = await res.json(); } catch (e) { }
                if (!res.ok) throw new Error(data.error || data.message || ('Error ' + res.status));

            }
            function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
            function optsCountry(sel) {
                var names = Object.keys(COUNTRIES).sort();
                if (!sel || !COUNTRIES[sel]) sel = 'Indonesia';
                return names.map(function (n) { return '<option value="' + esc(n) + '"' + (n === sel ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('');
            }
            function liveProgress() {
                if (!isMoving || !movingSince) return progress;
                var speed = ($('f_speed') && $('f_speed').value) || 'week';
                var dur = SPEED_MS[speed] || SPEED_MS.week;
                var elapsed = Date.now() - new Date(movingSince).getTime();
                var add = (elapsed / dur) * 100;
                return Math.min(100, Math.max(0, baseProgress + add));
            }
            function bearing(lat1, lng1, lat2, lng2) {
                var toRad = Math.PI / 180, toDeg = 180 / Math.PI;
                var φ1 = lat1 * toRad, φ2 = lat2 * toRad, Δλ = (lng2 - lng1) * toRad;
                var y = Math.sin(Δλ) * Math.cos(φ2);
                var x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
                return (Math.atan2(y, x) * toDeg + 360) % 360;
            }
            function lerp(a, b, t) { return a + (b - a) * t; }

            $('sSave').addEventListener('click', saveSettings);
            loadList(); refreshBox();

            async function loadList() {
                $('list').textContent = '...... loading';
                try {
                    ships = await api('/shipments');
                    if (!Array.isArray(ships)) ships = [];
                    if (!ships.length) { $('list').innerHTML = '<p class="hint">No shipments.</p>'; return; }
                    $('list').innerHTML = ships.map(function (s, i) {

                $('editor').style.display = 'block';

            function collectDraft(s) {
                return Object.assign({}, s || {}, {
                    code: codeEdit, history: historyLocal,
                    sender: { name: $('f_sn').value, phone: $('f_sp').value, email: $('f_se').value, address: $('f_sa').value },
                    receiver: { name: $('f_rn').value, phone: $('f_rp').value, email: $('f_re').value, address: $('f_ra').value },
                    package: { weightKg: $('f_w').value, length: $('f_len') && $('f_len').value, width: $('f_wid') && $('f_wid').value, height: $('f_hei') && $('f_hei').value, description: $('f_desc').value },
                    payment: { amount: $('f_amt').value, currency: $('f_cur').value, method: $('f_meth').value, status: $('f_payst').value },
                    route: { originCountry: $('f_o').value, destCountry: $('f_d').value, icon: $('f_icon').value, speed: $('f_speed').value, progress: progress, isMoving: isMoving, movingSince: movingSince, rotationDeg: rotationDeg },
                    waybillNumber: $('f_way').value, serviceType: $('f_svc').value, termsOfTrade: $('f_terms').value, carrier: $('f_car').value,
                    shipmentDate: $('f_sdate').value, estimatedDelivery: $('f_eta').value, pinProtected: !!(s && s.pinProtected)
                });

            function setupMap(oName, dName) {
                var o = COUNTRIES[oName] || COUNTRIES.Indonesia, d = COUNTRIES[dName] || COUNTRIES.Singapore;
                if (map) { try { map.remove(); } catch (e) { } map = null; marker = null; }
                map = L.map('map', { zoomControl: true }).setView([(o.lat + d.lat) / 2, (o.lng + d.lng) / 2], 3);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);
                L.marker([o.lat, o.lng]).addTo(map).bindPopup('Origin: ' + oName);
                L.marker([d.lat, d.lng]).addTo(map).bindPopup('Destination: ' + dName);
                line = L.polyline([[o.lat, o.lng], [d.lat, d.lng]], { color: '#D40511', weight: 3, dashArray: '6,8' }).addTo(map);
                map.fitBounds(line.getBounds(), { padding: [30, 30] });
                placeVehicle(liveProgress());
                setTimeout(function () { try { map.invalidateSize(); } catch (e) { } }, 200);
            }

            function placeVehicle(p) {
                if (!map) return;
                var o = COUNTRIES[$('f_o').value] || COUNTRIES.Indonesia;
                var d = COUNTRIES[$('f_d').value] || COUNTRIES.Singapore;
                var t = Math.min(1, Math.max(0, (p || 0) / 100));
                var lat = lerp(o.lat, d.lat, t), lng = lerp(o.lng, d.lng, t);
                var iconType = $('f_icon').value || 'truck';
                var emoji = ICONS[iconType] || '🚚';
                var deg = rotationDeg != null ? rotationDeg : bearing(o.lat, o.lng, d.lat, d.lng);
                var html = '<div class="veh-marker" style="transform:rotate(' + deg + 'deg)">' + emoji + '</div>';
                var ic = L.divIcon({ className: '', html: html, iconSize: [36, 36], iconAnchor: [18, 18] });
                if (marker) { marker.setLatLng([lat, lng]); marker.setIcon(ic); }
                else {
                    marker = L.marker([lat, lng], { icon: ic, draggable: true }).addTo(map);
                    marker.on('drag', function (ev) {
                        var pos = ev.target.getLatLng();
                        // project onto line o->d
                        var t2 = projectT(o, d, pos.lat, pos.lng);
                        progress = t2 * 100; baseProgress = progress; isMoving = false; movingSince = null; stopAnim();
                        setProgressUI(progress);
                        placeVehicle(progress);
                    });
                    marker.on('dragend', function () { /* stay */ });
                }
            }
            function projectT(o, d, lat, lng) {
                var ax = o.lng, ay = o.lat, bx = d.lng, by = d.lat;
                var px = lng, py = lat;
                var abx = bx - ax, aby = by - ay;
                var apx = px - ax, apy = py - ay;
                var ab2 = abx * abx + aby * aby || 1;
                var t = (apx * abx + apy * aby) / ab2;
                return Math.min(1, Math.max(0, t));
            }
            function setProgressUI(p) {
                p = Math.min(100, Math.max(0, p));
                progress = p;
                var fill = $('barFill'), lab = $('pctLabel');
                if (fill) fill.style.width = p + '%';
                if (lab) lab.textContent = Math.round(p) + '% of the way there. You can zoom and pan the map to follow along.';
                placeVehicle(p);
            }
            function bindBarDrag() {
                var track = $('barTrack'); if (!track) return;
                function setFromEvent(e) {
                    var rect = track.getBoundingClientRect();
                    var clientX = (e.touches && e.touches[0]) ? e.touches[0].clientX : (e.clientX);
                    var t = (clientX - rect.left) / rect.width;
                    t = Math.min(1, Math.max(0, t));
                    progress = t * 100; baseProgress = progress;
                    if (isMoving) { movingSince = new Date().toISOString(); }
                    setProgressUI(progress);
                }
                track.addEventListener('pointerdown', function (e) { track.setPointerCapture(e.pointerId); setFromEvent(e); });
                track.addEventListener('pointermove', function (e) { if (e.buttons || e.pressure) setFromEvent(e); });
                track.addEventListener('touchstart', function (e) { setFromEvent(e); }, { passive: true });
                track.addEventListener('touchmove', function (e) { setFromEvent(e); }, { passive: true });
            }
            function startAnim() {
                stopAnim();
                animTimer = setInterval(function () {
                    var p = liveProgress();
                    setProgressUI(p);
                    if (p >= 100) { pauseMove(); }
                }, 500);
            }
            function stopAnim() { if (animTimer) { clearInterval(animTimer); animTimer = null; } }
            function mapStatus(type, text) {
                var el = $('mapMsg');
                if (!el) return;

            function routeBody() {
                var o = COUNTRIES[$('f_o').value], d = COUNTRIES[$('f_d').value];
                return {
                    originCountry: $('f_o').value, destCountry: $('f_d').value,
                    originLat: o && o.lat, originLng: o && o.lng, destLat: d && d.lat, destLng: d && d.lng,
                    icon: $('f_icon').value, speed: $('f_speed').value,
                    progress: liveProgress(), isMoving: isMoving, movingSince: movingSince,
                    rotationDeg: rotationDeg
                };
            }
            async function saveRouteAuto(label) {
                if (!codeEdit) {
                    mapStatus('err', 'Save the shipment first (bottom Save), then use Play/Pause.');
                    return false;
                }
                mapStatus('wait', '......');
                try {
                    await api('/shipments/' + encodeURIComponent(codeEdit) + '/route', { method: 'PATCH', body: JSON.stringify(routeBody()) });
                    mapStatus('ok', (label || 'Saved'));
                    return true;
                } catch (e) {
                    mapStatus('err', e.message);
                    return false;
                }
            }
            async function playMove() {
                baseProgress = liveProgress();
                progress = baseProgress;
                movingSince = new Date().toISOString();
                isMoving = true;
                startAnim();
                mapStatus('wait', '......');
                var ok = await saveRouteAuto('Play · Saved — moving for selected duration');
                if (!ok) { /* keep anim local */ }
            }
            async function pauseMove() {
                progress = liveProgress();
                baseProgress = progress;
                isMoving = false;
                movingSince = null;
                stopAnim();
                setProgressUI(progress);
                mapStatus('wait', '......');
                await saveRouteAuto('Pause · Saved at ' + Math.round(progress) + '%');
            }
            async function resetMove() {
                stopAnim();
                progress = 0;
                baseProgress = 0;
                isMoving = false;
                movingSince = null;
                setProgressUI(0);
                mapStatus('wait', '......');
                await saveRouteAuto('Restart · Saved at 0%');
            }

            async function saveShipment() {
                var msg = $('edToast'); msg.className = 'toast wait'; msg.textContent = '...... saving';
                toast('wait', '...... saving');
                var body = {
                    code: $('f_code').value.trim() || undefined,

                    waybillNumber: $('f_way').value.trim(), serviceType: $('f_svc').value.trim(), termsOfTrade: $('f_terms').value.trim(),
                    carrier: $('f_car').value.trim(), shipmentDate: $('f_sdate').value, estimatedDelivery: $('f_eta').value,
                    originCountry: $('f_o').value, destCountryLabel: $('f_d').value,
                    route: {
                        originCountry: $('f_o').value, destCountry: $('f_d').value,
                        originLat: (COUNTRIES[$('f_o').value] || {}).lat, originLng: (COUNTRIES[$('f_o').value] || {}).lng,
                        destLat: (COUNTRIES[$('f_d').value] || {}).lat, destLng: (COUNTRIES[$('f_d').value] || {}).lng,
                        icon: $('f_icon').value, speed: $('f_speed').value,
                        progress: liveProgress(), isMoving: isMoving, movingSince: movingSince, rotationDeg: rotationDeg
                    }
                };
                var pin = $('f_pin').value.trim();
                if (!codeEdit) {
                    if (!/^[0-9]{4}$/.test(pin)) {
                        msg.className = 'toast err'; msg.textContent = 'New shipment needs a permanent 4-digit access PIN.';
                        toast('err', 'Access PIN required (4 digits)');
                        return;
                    }
                    body.accessPin = pin;
                }
                // Existing shipment: never change accessPin
                try {
                    var saved;
                    if (!codeEdit) {
                        if (!body.code) throw new Error('Enter a tracking code');
                        saved = await api('/shipments', { method: 'POST', body: JSON.stringify(body) });
                        codeEdit = saved.code;
                    } else {
                        saved = await api('/shipments/' + encodeURIComponent(codeEdit), { method: 'PUT', body: JSON.stringify(body) });
                    }
                    for (var i = 0; i < historyLocal.length; i++) {
                        try { await api('/shipments/' + encodeURIComponent(codeEdit) + '/status', { method: 'POST', body: JSON.stringify(historyLocal[i]) }); } catch (e2) { }
                    }
                    try {
                        await api('/shipments/' + encodeURIComponent(codeEdit) + '/route', { method: 'PATCH', body: JSON.stringify(body.route) });
                    } catch (e3) { }
                    msg.className = 'toast ok'; msg.textContent = 'Saved — public site, receipt & box use this data.';
                    toast('ok', 'Saved');
                    await loadList();
                } catch (e) { msg.className = 'toast err'; msg.textContent = e.message; toast('err', e.message); }
            }

            async function delShip() {
                if (!codeEdit || !confirm('Delete ' + codeEdit + ' permanently?')) return;
                toast('wait', '...... deleting');
                try { await api('/shipments/' + encodeURIComponent(codeEdit), { method: 'DELETE' }); toast('ok', 'Deleted'); $('editor').style.display = 'none'; loadList(); }
                catch (e) { toast('err', e.message); }
            }
            async function refreshBox() {
                try { var d = await api('/shipments/box-service'); boxOn = d.on !== false; $('btnBox').textContent = boxOn ? 'Box: ON' : 'Box: OFF'; }
                catch (e) { $('btnBox').textContent = 'Box: ?'; }
            }
            async function toggleBox() {
                toast('wait', '......');
                try { var d = await api('/shipments/box-service', { method: 'PUT', body: JSON.stringify({ on: !boxOn }) }); boxOn = d.on !== false; $('btnBox').textContent = boxOn ? 'Box: ON' : 'Box: OFF'; toast('ok', 'Box ' + (boxOn ? 'ON' : 'OFF')); }
                catch (e) { toast('err', e.message); }
            }
            async function saveSettings() {
                var msg = $('sMsg'); msg.className = 'toast wait'; msg.textContent = '...... saving';
                try {
                    var data = await api('/auth/credentials', { method: 'PUT', body: JSON.stringify({ currentPassword: $('sCur').value, newUsername: $('sUser').value.trim(), newPassword: $('sPass').value.trim(), newPin: $('sLoginPin').value.trim(), newChatPin: $('sChatPin').value.trim() }) });
                    msg.className = 'toast ok'; msg.textContent = 'Saved. User: ' + (data.username || '');
                } catch (e) { msg.className = 'toast err'; msg.textContent = e.message; }
            }
        })();
    </script>
</body>

</html>
