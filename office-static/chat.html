<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title> Office — Chat</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #efeff1;
      color: #eee;
      min-height: 100vh;
    }

    .wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    h1 {
      font-size: 1.25rem;
      margin: 0 0 8px;
      color: #FFCC00;
    }

    .sub {
      color: #888;
      font-size: 13px;
      margin-bottom: 20px;
    }

    input,
    button,
    textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #d9d5e6;
      color: #fff;
      font-size: 15px;
      margin-bottom: 10px;
    }

    button {
      background: #D40511;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    .hidden {
      display: none !important;
    }

    #threads {
      list-style: none;
      padding: 0;
      margin: 0 0 16px;
    }

    #threads li {
      padding: 12px;
      background: #b11b1b;
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      border: 1px solid #2a2a2a;
    }

    #threads li.active {
      border-color: #FFCC00;
    }

    #msgs {
      height: 280px;
      overflow-y: auto;
      background: #141414;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .msg {
      margin: 8px 0;
      padding: 8px 12px;
      border-radius: 10px;
      max-width: 85%;
      font-size: 14px;
    }

    .msg.admin {
      background: #D40511;
      margin-left: auto;
    }

    .msg.user {
      background: #2a2a2a;
    }

    .err {
      color: #ff6b6b;
      font-size: 13px;
    }

    .row {
      display: flex;
      gap: 8px;
    }

    .row button {
      flex: 1;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <div id="pinBox">
      <input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="Chat PIN" />
      <button type="button" id="pinBtn">Enter chat</button>
      <p id="pinErr" class="err"></p>
    </div>

    <div id="app" class="hidden">
      <ul id="threads"></ul>
      <div id="chatPane" class="hidden">
        <input id="unlock" type="password" placeholder="Shipment access code (optional)" />
        <div id="msgs"></div>
        <textarea id="reply" rows="2" placeholder="Reply…"></textarea>
        <div class="row">
          <button type="button" id="sendBtn">Send</button>
          <button type="button" id="clearOne" style="background:#333">Clear this</button>
        </div>
        <button type="button" id="clearAll" style="background:#333;margin-top:8px">Clear all chats</button>
      </div>
    </div>
  </div>
  <script>
    const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
      ? '/api'
      : 'https://my-delivery-w6xz.onrender.com/api';

    let token = sessionStorage.getItem('chatToken') || '';
    let selectedId = null;

    async function checkPin() {
      const pin = document.getElementById('pin').value.trim();
      document.getElementById('pinErr').textContent = '';
      try {
        const r = await fetch(API + '/chat/chat-pin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: pin || '4422' })
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || 'Wrong PIN');
        token = d.token || pin || '4422';
        sessionStorage.setItem('chatToken', token);
        document.getElementById('pinBox').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        loadThreads();
      } catch (e) {
        // offline / no route: allow local demo with 4422
        if ((pin || '4422') === '4422') {
          token = '4422';
          sessionStorage.setItem('chatToken', token);
          document.getElementById('pinBox').classList.add('hidden');
          document.getElementById('app').classList.remove('hidden');
          document.getElementById('threads').innerHTML = '<li>No threads yet (API offline or empty)</li>';
        } else {
          document.getElementById('pinErr').textContent = e.message || 'Wrong PIN';
        }
      }
    }

    async function loadThreads() {
      try {
        const r = await fetch(API + '/chat/admin/threads', {
          headers: { 'X-Chat-Pin': token }
        });
        const list = await r.json();
        const ul = document.getElementById('threads');
        if (!Array.isArray(list) || !list.length) {
          ul.innerHTML = '<li>No conversations yet</li>';
          return;
        }
        ul.innerHTML = list.map(t =>
          `<li data-id="${t._id || t.id}">${(t.label || t.trackingCode || 'Chat')} ${t.unread ? '(' + t.unread + ')' : ''}</li>`
        ).join('');
        ul.querySelectorAll('li[data-id]').forEach(li => {
          li.onclick = () => {
            selectedId = li.getAttribute('data-id');
            ul.querySelectorAll('li').forEach(x => x.classList.remove('active'));
            li.classList.add('active');
            document.getElementById('chatPane').classList.remove('hidden');
            loadMsgs();
          };
        });
      } catch (e) {
        document.getElementById('threads').innerHTML = '<li>Could not load threads</li>';
      }
    }

    async function loadMsgs() {
      if (!selectedId) return;
      try {
        const r = await fetch(API + '/chat/admin/threads/' + selectedId, {
          headers: { 'X-Chat-Pin': token }
        });
        const t = await r.json();
        const box = document.getElementById('msgs');
        const msgs = t.messages || t.msgs || [];
        box.innerHTML = msgs.map(m =>
          `<div class="msg ${m.from === 'admin' || m.role === 'admin' ? 'admin' : 'user'}">${(m.text || m.body || '').replace(/</g, '&lt;')}</div>`
        ).join('') || '<div class="sub">No messages</div>';
        box.scrollTop = box.scrollHeight;
      } catch (e) { }
    }

    document.getElementById('pinBtn').onclick = checkPin;
    document.getElementById('sendBtn').onclick = async () => {
      const text = document.getElementById('reply').value.trim();
      if (!text || !selectedId) return;
      await fetch(API + '/chat/admin/threads/' + selectedId + '/reply', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Chat-Pin': token },
        body: JSON.stringify({ text })
      });
      document.getElementById('reply').value = '';
      loadMsgs();
    };
    document.getElementById('clearOne').onclick = async () => {
      if (!selectedId || !confirm('Clear this chat?')) return;
      await fetch(API + '/chat/admin/threads/' + selectedId, {
        method: 'DELETE', headers: { 'X-Chat-Pin': token }
      });
      selectedId = null;
      document.getElementById('chatPane').classList.add('hidden');
      loadThreads();
    };
    document.getElementById('clearAll').onclick = async () => {
      if (!confirm('Clear ALL chats permanently?')) return;
      await fetch(API + '/chat/admin/threads', {
        method: 'DELETE', headers: { 'X-Chat-Pin': token }
      });
      loadThreads();
    };

    if (sessionStorage.getItem('chatToken') === '4422') {
      document.getElementById('pin').value = '4422';
    }
  </script>
</body>

</html>
