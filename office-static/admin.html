<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Login</title>
    <meta name="robots" content="noindex,nofollow">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: #0b51f5;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .card {
            width: 100%;
            max-width: 400px;
            background: #135fda;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .4);
            position: relative;
        }

        .head {
            background: #1c1d1d;
            padding: 24px 20px;
            text-align: center;
            border-bottom: 1px solid #141414;
        }

        .head .badge {
            display: inline-block;
            background: #0e0e0e;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 10px;
        }

        .head h1 {
            margin: 0;
            font-size: 22px;
            color: #f8fafc;
        }

        .head p {
            margin: 8px 0 0;
            font-size: 13px;
            color: #94a3b8;
        }

        .body {
            padding: 24px 20px 28px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #121213;
            background: #0f172a;
            color: #f1f5f9;
            font-size: 15px;
            margin-bottom: 14px;
        }

        input:focus {
            outline: 2px solid #64748b;
            border-color: #64748b;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 28px;
            background: #3b82f6;
            color: #fff;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:disabled {
            opacity: .7;
            cursor: wait;
        }

        .err {
            color: #f87171;
            font-size: 13px;
            min-height: 18px;
            margin-bottom: 10px;
        }

        .note {
            text-align: center;
            margin-top: 16px;
            font-size: 12px;
            color: #64748b;
        }

        #pinStep {
            display: none;
        }

        .wait {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, .92);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        .wait.show {
            display: flex;
        }

        .wait .dots {
            font-size: 28px;
            letter-spacing: 4px;
            color: #93c5fd;
            font-weight: 700;
        }

        .wait .txt {
            margin-top: 10px;
            font-size: 14px;
            color: #e2e8f0;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="wait" id="alWait">
            <div class="dots" id="alDots">......</div>
            <div class="txt">Please wait</div>
        </div>
        <div class="head">
            <div class="badge">PROJECT</div>
            <h1>Office Login</h1>
            <p>not a carrier brand</p>
        </div>
        <div class="body">
            <div id="loginStep">
                <p class="err" id="loginErr"></p>
                <label>Username</label>
                <input type="text" id="alUser" autocomplete="username">
                <label>Password</label>
                <input type="password" id="alPass" autocomplete="current-password">
                <button type="button" class="btn" id="alLoginBtn" onclick="doLogin()">Continue</button>
            </div>
            <div id="pinStep">
                <p class="err" id="pinErr"></p>
                <p style="font-size:13px;color:#94a3b8;margin:0 0 12px;">Enter office PIN to continue.</p>
                <label>Office PIN</label>
                <input type="password" id="alPin" inputmode="numeric" maxlength="8" autocomplete="one-time-code">
                <button type="button" class="btn" id="alPinBtn" onclick="doPin()">Enter office</button>
            </div>
            <p class="note"></p>
        </div>
    </div>
    <script>
        // Point this to your Render backend when hosted on Netlify
        const API = (function () {
            const h = location.hostname;
            if (h === 'localhost' || h === '127.0.0.1') return '/api';
            return 'https://my-delivery-w6xz.onrender.com/api';
        })();
        // After login go to board on same host (Netlify) or package site board
        const BOARD_URL = (function () {
            const h = location.hostname;
            if (h.indexOf('netlify') !== -1 || h.indexOf('anotherway') !== -1) return '/board.html';
            return '/board.html';
        })();

        let loginTicket = null, waitTimer = null;
        function showWait() {
            document.getElementById('alWait').classList.add('show');
            let n = 1;
            clearInterval(waitTimer);
            waitTimer = setInterval(function () {
                n = n >= 6 ? 1 : n + 1;
                document.getElementById('alDots').textContent = '.'.repeat(n);
            }, 280);
            document.getElementById('alLoginBtn').disabled = true;
            document.getElementById('alLoginBtn').textContent = '......';
            var b2 = document.getElementById('alPinBtn');
            if (b2) { b2.disabled = true; b2.textContent = '......'; }
        }
        function hideWait() {
            document.getElementById('alWait').classList.remove('show');
            clearInterval(waitTimer);
            document.getElementById('alLoginBtn').disabled = false;
            document.getElementById('alLoginBtn').textContent = 'Continue';
            var b2 = document.getElementById('alPinBtn');
            if (b2) { b2.disabled = false; b2.textContent = 'Enter office'; }
        }
        async function doLogin() {
            const err = document.getElementById('loginErr');
            err.textContent = '';
            const username = document.getElementById('alUser').value.trim();
            const password = document.getElementById('alPass').value;
            if (!username || !password) { err.textContent = 'Enter username and password.'; return; }
            showWait();
            try {
                const r = await fetch(API + '/auth/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await r.json();
                if (!r.ok) throw new Error(data.error || 'Login failed');
                if (data.step === 'pin_required') {
                    loginTicket = data.loginTicket;
                    document.getElementById('loginStep').style.display = 'none';
                    document.getElementById('pinStep').style.display = 'block';
                    hideWait();
                    document.getElementById('alPin').focus();
                } else if (data.token) {
                    sessionStorage.setItem('dhlAdminToken', data.token);
                    location.href = BOARD_URL;
                } else hideWait();
            } catch (e) { hideWait(); err.textContent = e.message; }
        }
        async function doPin() {
            const err = document.getElementById('pinErr');
            err.textContent = '';
            const pin = document.getElementById('alPin').value.trim();
            if (!pin) { err.textContent = 'Enter PIN.'; return; }
            showWait();
            try {
                const r = await fetch(API + '/auth/verify-pin', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ loginTicket, pin })
                });
                const data = await r.json();
                if (!r.ok) throw new Error(data.error || 'PIN failed');
                sessionStorage.setItem('dhlAdminToken', data.token);
                location.href = BOARD_URL;
            } catch (e) { hideWait(); err.textContent = e.message; }
        }
        document.getElementById('alPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
        document.getElementById('alPin').addEventListener('keydown', e => { if (e.key === 'Enter') doPin(); });
    </script>
</body>

</html>
